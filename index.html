<title>Hiillos</title>
<style>
/* ============================================================
   Colour + material tokens
   ============================================================ */
/* Hiillos — embers on black. Dark only, deliberately: an ember has no
   light-mode equivalent, and the whole idea is a slow glow in the dark. */
:root{
  color-scheme: dark;
  --bg:#0A0908; --card:#16130F; --raised:#221C15;
  --label:#FFF4E8; --label2:rgba(255,238,222,.60); --label3:rgba(255,238,222,.32);
  --sep:rgba(255,178,110,.13);

  /* An ORDERED heat ramp, not four interchangeable oranges. A fire has a
     gradient, so the palette can carry meaning instead of just decorating:
     banked coal for the energy you spend lying still, flame for the energy
     you spend on purpose. Used in that order by the composition bar. */
  --char:#5A1B08;       /* h1 — banked, nearly out: resting metabolism */
  --ember-lo:#8E2E0B;   /* h2 — smouldering: incidental movement */
  --ember:#FF7A18;      /* h3 — the live coal, and the primary accent */
  --ember-hi:#FFB43D;   /* h4 — flame: deliberate training */
  --ash:#E8C9A0;        /* h5 — pale, off the ramp: digestion */

  --good:#5FD08A;       /* one cool note, so "on target" reads instantly */
  --warn:#FFB43D;
  --bad:#FF4E3A;

  --fill:rgba(255,170,90,.11);
  --fill2:rgba(255,170,90,.18);
  --press:rgba(255,170,90,.16);
  --chrome:rgba(14,12,10,.74);
  --chrome-edge:rgba(255,170,90,.13);
  --shadow-lg:0 14px 44px rgba(0,0,0,.72), 0 0 24px rgba(255,110,20,.07);
  --r-card:14px; --r-ctl:11px;

  /* legacy aliases so existing markup keeps working */
  --blue:var(--ember); --orange:var(--ember-hi); --red:var(--bad); --green:var(--good);
}
@media (prefers-reduced-transparency: reduce){
  :root{ --chrome:#100E0C; }
}

/* ============================================================
   Typography — tracking and leading are size-specific (§15).
   A single letter-spacing value is wrong at one end of the scale.
   ============================================================ */
.t-large  {font-size:34px; font-weight:700; letter-spacing:-.028em; line-height:1.06}
.t-title  {font-size:28px; font-weight:700; letter-spacing:-.022em; line-height:1.12}
.t-huge   {font-size:44px; font-weight:700; letter-spacing:-.032em; line-height:1;
           font-variant-numeric:tabular-nums}
.t-head   {font-size:17px; font-weight:600; letter-spacing:-.012em; line-height:1.3}
.t-body   {font-size:17px; font-weight:400; letter-spacing:-.011em; line-height:1.4}
.t-sub    {font-size:15px; font-weight:400; letter-spacing:-.006em; line-height:1.35}
.t-foot   {font-size:13px; font-weight:400; letter-spacing:-.001em; line-height:1.4}
.t-cap    {font-size:12px; font-weight:400; letter-spacing:0;       line-height:1.35}
/* small uppercase wants POSITIVE tracking — the opposite of the display sizes */
.t-section{font-size:13px; font-weight:600; letter-spacing:.045em; text-transform:uppercase;
           line-height:1.3; color:var(--label2)}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--bg); -webkit-text-size-adjust:100%}
html,body{margin:0; padding:0}
body{
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  letter-spacing:-.011em;
  background:var(--bg); color:var(--label);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit}
button,.row,.tab,.seg button{-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text; user-select:text}

/* ============================================================
   Layout — #clip contains the horizontally translating #stage,
   so the neighbouring days sit offscreen without creating a
   horizontal scrollbar.
   ============================================================ */
#clip{overflow-x:clip; position:relative}
/* Vertical scrolling stays the browser's job; horizontal is ours. Without
   this the OS competes for every horizontal move and the swipe feels like
   it's fighting you. */
#stage{position:relative; will-change:transform; touch-action:pan-y}
@supports (touch-action: pan-y pinch-zoom){
  #stage{touch-action:pan-y pinch-zoom}   /* keep accessibility zoom */
}
.pane{width:100%; max-width:620px; margin:0 auto; padding:0 16px}
.pane.ghost{position:absolute; top:0; left:0; right:0}

/* ============================================================
   Brand bar — the app had no mark anywhere and "Hiillos" appeared only in
   the browser tab. FIXED rather than part of the pane, for the same reason
   the tab bar is: it exists once, it never scrolls away, and the
   neighbouring days sliding under your finger don't each carry a copy of
   it. Same translucent chrome as the bottom bar so they read as a pair.

   The wordmark is set in the system serif against the sans UI — that
   contrast is what gives an app a voice, and it costs no download, so the
   app still works offline.
   ============================================================ */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:55;
  display:flex; align-items:center; gap:9px;
  padding:max(6px,env(safe-area-inset-top)) 16px 8px;
  background:var(--chrome);
  backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
  box-shadow:inset 0 -.5px 0 var(--chrome-edge);
}
.topbar .mark{
  width:30px; height:30px; flex:0 0 auto; display:block;
  /* the mark's own background is #080708 against the app's #0A0908 — two
     values apart out of 255, so it needs no mask or rounding to sit flush */
}
.topbar .word{
  /* Superclarendon: a slab serif, and the best display face that ships on
     both iOS and macOS. Slabs carry weight and warmth — the letterforms look
     stamped into something — which suits a name meaning "embers" far better
     than the default New York, and far better than any geometric sans. All
     system faces, so nothing is downloaded and the app still opens offline.
     Slabs also want slightly tighter tracking than body text at this size. */
  font-family:"Superclarendon","Iowan Old Style","Charter",ui-serif,Georgia,serif;
  font-optical-sizing:auto;
  font-size:21px; font-weight:600; letter-spacing:-.012em;
  color:var(--ember); line-height:1;
  /* the descender-free wordmark sits optically low against a 30px mark */
  transform:translateY(-.5px);
}
.topbar .spacer{flex:1}
.topbar .phase{
  font-size:11px; color:var(--label3); letter-spacing:.02em;
  font-variant-numeric:tabular-nums; text-align:right; line-height:1.25;
}

/* every pane clears the fixed bar */
.pane, .pane.ghost{padding-top:calc(46px + max(6px,env(safe-area-inset-top)))}

h1{margin:6px 0 2px}
.sectionhead{display:flex; align-items:baseline; justify-content:space-between;
             gap:10px; margin:26px 0 8px; padding:0 4px}
.sectionhead a{color:var(--blue); cursor:pointer; font-size:14px; font-weight:500}

/* ============================================================
   Cards + rows
   ============================================================ */
.card{background:var(--card); border-radius:var(--r-card); overflow:hidden; margin-bottom:12px}
.row{display:flex; align-items:center; gap:12px; padding:12px 16px;
     border-bottom:.5px solid var(--sep); position:relative; background:var(--card)}
.row:last-child{border-bottom:none}
.row .grow{flex:1; min-width:0}
.row .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .sub2{color:var(--label2); margin-top:1px}
.val{font-variant-numeric:tabular-nums; color:var(--label2)}
.val.big{color:var(--label); font-weight:600}
.chev{color:var(--label3); flex:0 0 auto; font-size:19px; line-height:1}

/* Press feedback lands on pointer-DOWN, never on release (§1).
   Rows tint, controls scale — matching how iOS treats each. */
[data-press]{transition:background-color 130ms cubic-bezier(.25,.8,.35,1),
                        transform 130ms cubic-bezier(.25,.8,.35,1)}
/* Layer the highlight OVER the row's own colour rather than replacing it.
   Setting a translucent background-color here swapped out the opaque card
   fill, which let the red Delete panel parked behind the row show straight
   through on an ordinary tap. */
.row[data-press].pressing{background-image:linear-gradient(var(--press),var(--press))}
.ctl[data-press].pressing{transform:scale(.965); opacity:.85}

/* ============================================================
   Controls
   ============================================================ */
input,select,textarea{color:var(--label); background:transparent; border:none; outline:none;
  font-variant-numeric:tabular-nums; font-size:17px; letter-spacing:-.011em}
input[type=number],input[type=text],input[type=date]{
  background:var(--fill); border-radius:9px; padding:8px 11px; width:100%; min-width:0}
input[type=number]{text-align:right; max-width:112px}
textarea{background:var(--fill); border-radius:var(--r-ctl); padding:11px 13px; width:100%;
  resize:vertical; min-height:88px; line-height:1.45; font-size:17px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-size:17px; font-weight:600; letter-spacing:-.012em;
  background:var(--blue); color:#fff; border:none; border-radius:var(--r-ctl);
  padding:13px 18px; cursor:pointer; width:100%}
.btn.sec{background:var(--fill); color:var(--blue)}
.btn.dim{background:var(--fill); color:var(--label)}
.btn.danger{background:var(--fill); color:var(--red)}
.seg{display:flex; background:var(--fill); border-radius:10px; padding:2px; margin-bottom:12px;
     position:relative}
.seg .thumb{position:absolute; top:2px; bottom:2px; border-radius:8px; background:var(--raised);
  box-shadow:0 1px 4px rgba(0,0,0,.5); will-change:transform,width; z-index:0}

.seg button{flex:1; position:relative; z-index:1; font-size:14px; font-weight:600;
  letter-spacing:-.006em; color:var(--label); background:none; border:none; border-radius:8px;
  padding:8px 4px; cursor:pointer}
.del{color:var(--red); font-size:20px; background:none; border:none; cursor:pointer;
     padding:2px 4px; line-height:1; flex:0 0 auto}
.add{color:var(--blue); font-size:15px; font-weight:600; background:none; border:none;
     cursor:pointer; padding:2px 6px; flex:0 0 auto}

/* ============================================================
   Rings + bars — driven by springs, animating transform/opacity
   only so they stay on the compositor (§11).
   ============================================================ */
.rings{display:flex; align-items:center; gap:18px; padding:18px 16px}
.ringwrap{position:relative; flex:0 0 auto}
.ringtxt{position:absolute; inset:0; display:flex; flex-direction:column;
         align-items:center; justify-content:center}
.ringtxt b{font-size:26px; font-weight:700; letter-spacing:-.022em;
           font-variant-numeric:tabular-nums; line-height:1}
.ringtxt span{font-size:11px; color:var(--label2); margin-top:2px; letter-spacing:0}
.macros{flex:1; display:flex; flex-direction:column; gap:9px; min-width:0}
.macro{display:flex; align-items:center; gap:9px}
.macro .nm{width:54px; color:var(--label2); flex:0 0 auto; font-size:13px}
.macro .bar{flex:1; height:7px; background:var(--fill); border-radius:4px; overflow:hidden}
.macro .bar i{display:block; height:100%; border-radius:4px; width:100%;
  transform:scaleX(0); transform-origin:left center; will-change:transform}
.macro .qt{flex:0 0 auto; font-variant-numeric:tabular-nums; color:var(--label2);
  font-size:12px; min-width:70px; text-align:right}

/* ============================================================
   Composition bar — the burn card used to be eight rows of near-identical
   text, which is a receipt rather than a picture. This makes the shape of
   the day legible at a glance: that roughly two thirds of it is you lying
   still, and that a whole day of walking is a sliver.
   ============================================================ */
.comp{padding:16px 16px 14px}
.comp .tot{display:flex; align-items:baseline; gap:8px; margin-bottom:2px; padding:0; border:none}
.comp .tot b{font-size:34px; font-weight:700; letter-spacing:-.028em; line-height:1;
             font-variant-numeric:tabular-nums; color:var(--label)}
.comp .tot span{font-size:13px; color:var(--label2)}
.comp .bar{display:flex; height:26px; border-radius:7px; overflow:hidden; margin:11px 0 10px;
           background:var(--fill)}
.comp .bar i{display:block; min-width:0; transition:width 260ms cubic-bezier(.25,.8,.35,1)}
.comp .leg{display:flex; flex-wrap:wrap; gap:5px 14px}
.comp .leg span{font-size:11.5px; color:var(--label2); display:flex; align-items:center; gap:5px;
                font-variant-numeric:tabular-nums}
.comp .leg i{width:8px; height:8px; border-radius:2px; flex:0 0 auto}
.disc{display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:12px 16px; cursor:pointer; color:var(--blue); font-size:14px; font-weight:500;
      background:none; border:none; width:100%; text-align:left;
      border-top:.5px solid var(--sep)}
.disc .car{transition:transform 200ms cubic-bezier(.25,.8,.35,1); font-size:17px; line-height:1}
.disc[aria-expanded="true"] .car{transform:rotate(90deg)}

.kv{display:flex; justify-content:space-between; gap:12px; padding:9px 16px;
    font-size:15px; letter-spacing:-.006em; border-bottom:.5px solid var(--sep)}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-variant-numeric:tabular-nums; font-weight:500}
.kv.tot{font-weight:600; font-size:17px; padding:12px 16px; letter-spacing:-.012em}
.pill{font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px; display:inline-block}
.pill.g{background:color-mix(in srgb,var(--green) 16%,transparent); color:var(--green)}
.pill.o{background:color-mix(in srgb,var(--orange) 18%,transparent); color:var(--orange)}
.pill.r{background:color-mix(in srgb,var(--red) 16%,transparent); color:var(--red)}
.note{font-size:13px; color:var(--label2); line-height:1.45; padding:11px 16px}
.warn{background:color-mix(in srgb,var(--orange) 12%,transparent); border-radius:var(--r-ctl);
  padding:11px 14px; font-size:13.5px; line-height:1.45; margin-bottom:12px}
.empty{padding:26px 16px; text-align:center; color:var(--label3); font-size:14.5px; line-height:1.5}
.chart{width:100%; height:auto; display:block}

/* ============================================================
   Swipe-to-delete
   ============================================================ */
.swipe{position:relative; overflow:hidden}
/* opaque, so nothing parked behind it can ever show through */
.swipe .surface{position:relative; z-index:1; will-change:transform; background:var(--card)}
.swipe .action{position:absolute; top:0; right:0; bottom:0; width:96px;
  background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:600; letter-spacing:-.006em; z-index:0; cursor:pointer}

/* ============================================================
   Chrome — a translucent floating layer, with a scroll edge
   effect instead of a hard 1px divider (§12).
   ============================================================ */
.tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; z-index:50;
  background:var(--chrome);
  backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:inset 0 .5px 0 var(--chrome-edge)}
/* No separate scroll-edge overlay. Painting a page-background gradient
   above the bar looks right over the page but stamps a grey band with a
   hard edge across any white card underneath it. The tab bar's own
   backdrop blur already does the separating. */
.tab{flex:1; background:none; border:none; padding:8px 2px 7px; cursor:pointer;
  font-size:10px; font-weight:500; letter-spacing:.005em; color:var(--label3);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  transition:color 180ms ease}
.tab.on{color:var(--blue)}
.tab svg{width:25px; height:25px; display:block; will-change:transform}

/* Materialise: blur + scale together, so a glass surface reads as
   arriving rather than fading in (§12). */
.sheet{position:fixed; left:10px; right:10px; z-index:60;
  bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--chrome);
  backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-radius:16px; padding:13px 15px; box-shadow:var(--shadow-lg);
  font-size:14px; line-height:1.45; display:flex; gap:11px; align-items:flex-start;
  will-change:transform,opacity}
/* The install hint can afford to be glass — it's one line and nothing depends
   on reading it. A confirmation listing food you're about to log cannot: an
   element with its own transform doesn't reliably get a backdrop-filter, and
   .74 alpha with no blur behind it leaves the page text showing straight
   through the numbers. So this one carries a real background. */
.sheet.js-sheet{
  background:#191510;
  background:color-mix(in srgb, var(--raised) 88%, #000);
  border:.5px solid var(--chrome-edge);
  align-items:stretch;
  /* Deliberately NOT glass. An element that carries its own transform is not
     reliably given a backdrop-filter — the spec makes the transform establish
     a containing block, and engines differ on whether the filter still
     samples the page behind it. With the filter on and the animation mid-
     flight, the page text showed straight through the food you were being
     asked to confirm. A solid background can't fail that way, and the filter
     was buying nothing once the background was opaque. */
  backdrop-filter:none; -webkit-backdrop-filter:none;
}
.sheet.js-sheet code{
  font-size:12.5px; background:var(--fill); padding:1px 5px; border-radius:5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.toast{position:fixed; left:50%; z-index:99; pointer-events:none;
  bottom:calc(90px + env(safe-area-inset-bottom));
  background:rgba(38,28,18,.90); color:var(--label);
  border:.5px solid var(--chrome-edge);
  backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  padding:11px 18px; border-radius:22px; font-size:14.5px; font-weight:500;
  max-width:88vw; text-align:center; opacity:0; will-change:transform,opacity}


.datebar{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.datebar .nav{background:var(--fill); border:none; color:var(--blue); font-size:18px;
  width:32px; height:32px; border-radius:50%; cursor:pointer; line-height:1; flex:0 0 auto}
.datebar input{background:transparent; font-size:15px; color:var(--label2); padding:0; width:auto}
.dots{display:flex; gap:5px; align-items:center; margin-left:auto}
.dot{width:6px; height:6px; border-radius:50%; background:var(--label3)}
.dot.on{background:var(--blue)}

/* Contrast preference: give surfaces a real edge (§14) */
@media (prefers-contrast: more){
  .card,.tabbar,.sheet{border:1px solid var(--label2)}
  :root{--label2:#3C3C43CC; --sep:#3C3C4366}
}
/* Reduced motion: keep meaning, drop the vestibular load (§14) */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important}
  [data-press]{transition:background-color 90ms linear}
  .ctl[data-press].pressing{transform:none; opacity:.7}
}
</style>

<body>
<header class="topbar" id="topbar"></header>
<div id="clip"><div id="stage"><div class="pane" id="root"></div></div></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =================================================================
   HIILLOS ("embers") — single file, no dependencies, no network.
   A slow steady burn, not a blaze.
   Interaction model follows Apple's fluid-interface principles:
   respond on touch-down, track 1:1, project momentum, stay
   interruptible, and animate from the presentation value.
   ================================================================= */

var KEY = "cut_tracker_v1";

/* ---------- storage (degrades gracefully if localStorage is blocked) ---------- */
var Store = {
  ok: (function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
       catch(e){ return false; } })(),
  load: function(){ if(!this.ok) return null; try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } },
  save: function(d){ if(!this.ok) return false; try{ localStorage.setItem(KEY, JSON.stringify(d)); return true; }catch(e){ return false; } }
};

var SCHEMA = 7;
var TKEY = "hiillos_gh_token";   // token lives OUTSIDE S so exports can't leak it

var DEFAULT_PROFILE = {
  /* These are placeholders, deliberately. Set them in Setup on first run —
     or, if you have GitHub sync configured, a fresh device pulls your real
     profile down and overwrites all of them. Nothing personal is baked into
     this file. */
  age:30, height:175, sex:"m",

  /* BMR is DERIVED from your current weight, not stored flat. A fixed number
     silently overestimates as you lose. For a 180 cm 25-year-old, Mifflin-St
     Jeor gives 1905 at 90 kg but 1805 at 80 kg, so a value hardcoded at the
     start would credit ~100 kcal/day of fiction by the end of a 10 kg cut. "katch"
     uses Katch-McArdle off lean mass, which is the better formula once you
     have a real body-composition reading, and on a bioimpedance scale's own
     fat-free figure the two usually land within about 20 kcal of each other. */
  bmrMode:"mifflin",  // "mifflin" | "katch" | "manual"
  bmrManual:1800,
  leanMass:0,         // fat-free mass in kg, from a scale — 0 = not known

  wakingHours:16,     // hours awake; the rest of the 24 h is covered by BMR

  /* WALKING. The net cost of a step is not a MET — it falls straight out of
     the ACSM level-walking equation, where the horizontal term is 0.1 ml of
     oxygen per kg per metre travelled:

         net kcal/step = stride(m) × weight(kg) / 2000

     Cadence cancels out completely, which is why it is no longer an input at
     all. At a 0.75 m stride and 90 kg that gives 0.0338 kcal/step, or
     0.50 kcal/kg/km — exactly where the walking-economy literature lands.
     A 3.9-MET route would give 0.0422, about 19% high, because Compendium
     METs are gross and assume a 3.5 ml/kg/min resting rate that a heavier
     young adult does not actually have. */
  strideCm:0,         // 0 = derive from height (0.415 × height)
  walkFactor:1.00,    // walking-economy multiplier, if you ever need to tune it

  /* IDLE NEAT rides on your HABITUAL step level, never on today's. Someone
     who averages 12k steps really does stand, carry and fidget more than
     someone who averages 3k — but going for one evening walk does not
     retroactively make the rest of that day busier. Keying this to a 28-day
     median rather than today's count is what stops a single walk being paid
     for twice: once as walking, and again as "you must have been busier". */
  metIdle:1.25,       // idle intensity at your habitual step level
  stepsRef:3500,      // the step level metIdle was calibrated at
  /* ZERO by default, deliberately. This encodes the cross-sectional
     observation that people who walk more also stand and fidget more, as MET
     per 1000 habitual steps. It holds BETWEEN people and is unreliable WITHIN
     one person, and switching it on re-creates the very double-count this
     model exists to remove — one level up from the daily case.

     Concretely: take up a 4,000-step evening walk every day and the walking
     term correctly adds about 140 kcal, while at 0.024 the idle term adds
     another 115 for the same behaviour. A deliberate exercise bout is not
     evidence that your school day involved more standing. Leave it at 0, let
     the walking term price walking, and move metIdle if your actual lifestyle
     activity changes — or let the measured calibration find it. */
  neatSlope:0,        // MET per 1000 steps of HABITUAL level above stepsRef

  /* Activity above your habitual baseline is credited at less than face value.
     Exercise-compensation work finds total daily expenditure rises by well
     under the cost of the activity added, and the effect is amplified when
     that activity sits on top of a diet deficit — which is precisely your
     case. 1.0 turns this off entirely. */
  compFactor:0.75,

  gymMins:60,         // so gym minutes leave the "everything else" pool
  gymKcal:300,
  restHR:60,
  /* TWO max-heart-rate figures, because they are used for two different jobs
     and the right answer differs.

     maxHR is your PHYSIOLOGICAL maximum, used to turn a heart rate into a
     fraction of heart-rate reserve. Tanaka (208 − 0.7 × age) is a better
     estimator than the old 220 − age, which overshoots for the young.

     zoneBasisHR is whatever figure your WATCH used when it decided which zone
     a minute belonged to — Fitbit uses 220 − age. Zone minutes have to be
     priced against that, not against your real maximum, or the app charges a
     "Cardio" minute at a heart rate the watch never used to bucket it. Getting
     this wrong shifted a two-hour zone-logged game by about 65 kcal. */
  maxHR:190,          // physiological, for %HRR  (Tanaka at 26)
  zoneBasisHR:0,      // 0 = derive 220 − age, which is what Fitbit uses
  vo2max:45,
  /* Deliberate under-estimate on the football figure. The Keytel regression
     is known to overestimate in intermittent team sport, and wrist optical
     sensors are least accurate in exactly that setting — heart rate drifts
     upward under thermal and emotional load without oxygen uptake following.
     While cutting, under-crediting is the safer error. */
  margin:12,

  /* TEF is macro-additive, with no flat rate anywhere: protein 25% of its own
     energy, carbs 7.5%, fat 2.5% — the midpoints of the measured 20-30 /
     5-10 / 0-3% bands. On a high-protein cut the real figure lands nearer 14%
     of intake than the textbook 10-12%. */
  proteinTarget:150,

  deficit:500,        // fallback only — the plan below normally decides
  goalWeight:75, goalBF:15,
  rateTol:0.35,       // ±35% around the rate your deficit implies = "on target"
  calibrate:0,        // apply the measured-TDEE correction

  ghRepo:"", ghPath:"hiillos.json", ghAuto:1
};

/* THE PLAN, as phases. The daily deficit is a FUNCTION of your trend weight
   rather than a number you keep editing by hand — which is the whole point:
   editing one global number retroactively rewrote what every past day was
   supposed to be, so history would claim you had under-eaten by 200 kcal on
   days you had actually hit target exactly. Bands are tested top-down. */
var DEFAULT_PLAN = {
  mode:"auto",              // "auto" = the bands decide | "manual" = profile.deficit
  /* Placeholder phases. Edit them in Setup, or let a synced device replace
     them. The shape is the point: a bigger deficit while there is more fat to
     lose, tapering as you approach goal. */
  bands:[
    {above:85, deficit:700, label:"above 85"},
    {above:80, deficit:600, label:"85 \u2192 80"},
    {above:75, deficit:500, label:"80 \u2192 75"},
    {above:0,  deficit:400, label:"below 75"}
  ],
  windows:[]                // [{from,to,deficit,label}] — exams, illness, holidays
};

/* Thermic effect per gram = Atwater energy × the thermic fraction of each
   macro (protein 25%, carbs 7.5%, fat 2.5% — the midpoints of the measured
   20-30 / 5-10 / 0-3% ranges). Protein costs about a quarter of its own energy
   just to be processed, which is why a high-protein cut runs a noticeably
   higher TEF than the textbook flat 10%. */
var TEF_P = 1.000, TEF_C = 0.300, TEF_F = 0.225;
function tefOf(e){ return (e.p||0)*TEF_P + (e.c||0)*TEF_C + (e.f||0)*TEF_F; }

/* The rate to assume for food you HAVEN'T logged yet. Built from your own
   targets — protein at target, the rest split by energy roughly 55/45 between
   carbs and fat — so it is your diet's real thermic cost rather than a number
   typed into a settings screen. Clamped to the range whole-diet measurements
   actually span, so a silly protein target can't invent free calories. */
function plannedTefRate(kcal){
  var P = S.profile;
  var p = Math.max(0, +P.proteinTarget || 0);
  if(!(kcal > 0)) return 0.12;
  var pk = Math.min(kcal, p*4);
  var restK = Math.max(0, kcal - pk);
  var c = restK*0.55/4, f = restK*0.45/9;
  var r = tefOf({p:p, c:c, f:f}) / kcal;
  return Math.max(0.06, Math.min(0.16, r));
}

/* ---------- body: weight and BMR, both as functions of the DAY ---------- */

/* The weight that was true on a given date. Every past day used to be priced
   at today's weight, which quietly rewrote its walking and football numbers
   every time you stepped on the scale. */
function weightAt(d){
  var arr = sortedWeights();
  if(!arr.length) return 80;
  var best = null;
  for(var i=0;i<arr.length;i++){ if(arr[i].d <= d) best = arr[i]; else break; }
  return best ? best.w : arr[0].w;
}
function latestWeight(){
  var arr = sortedWeights();
  return arr.length ? arr[arr.length-1].w : 80;
}

/* Mifflin-St Jeor, evaluated at that day's weight so it tracks you down.
   Katch-McArdle is offered because it uses lean mass directly, which makes it
   the better choice while you have a current body-comp reading. */
function bmrAt(d){
  var P = S.profile, w = weightAt(d);
  if(P.bmrMode === "manual") return Math.max(0, +P.bmrManual || 0);
  if(P.bmrMode === "katch" && +P.leanMass > 0) return 370 + 21.6 * (+P.leanMass);
  var s = (P.sex === "f") ? -161 : 5;
  return 10*w + 6.25*(+P.height||175) - 5*(+P.age||30) + s;
}

/* ---------- walking ---------- */

/* Step length. Walking step length runs about 0.415 × standing height for
   men, so 0.75 m at 180 cm. Override it in Setup if you've ever actually
   measured yours over a known distance. */
function strideM(P){
  var cm = +P.strideCm;
  if(cm > 20) return cm/100;
  return 0.415 * (+P.height||175) / 100;
}

/* Net kcal per step, straight from the ACSM level-walking equation. Note that
   cadence does not appear: the oxygen cost is per METRE travelled, so walking
   the same distance faster costs the same total energy, just sooner. */
function perStepKcal(P, w){
  w = w || latestWeight();
  return Math.max(0, strideM(P) * w / 2000 * pnum(P.walkFactor, 1));
}

/* ---------- habitual activity ---------- */

/* Your own normal, as a 28-day median of the days you actually recorded steps
   for. A median rather than a mean so one 20k-step day doesn't move it. This
   is the single number that fixes the evening-walk problem: idle NEAT is
   priced off THIS, and only the steps above it are treated as extra activity. */
var _habCache = null;
function invalidateHab(){ _habCache = null; }
function habitualSteps(){
  if(_habCache !== null) return _habCache;
  var v = [];
  for(var i=1;i<=28;i++){
    var x = S.days[shift(today,-i)];
    if(x && +x.steps > 0) v.push(+x.steps);
  }
  if(v.length < 5){ _habCache = Math.max(0, +S.profile.stepsRef || 3500); return _habCache; }
  v.sort(function(a,b){ return a-b; });
  var m = v.length % 2 ? v[(v.length-1)/2] : (v[v.length/2-1]+v[v.length/2])/2;
  _habCache = m;
  return _habCache;
}

/* How hard the non-walking part of your day is, as a MET. Driven by your
   HABITUAL step level, so it is a property of your life rather than of today
   — which is the fix. Under the old model an extra 4,000 evening steps lifted
   this by 0.10 MET across ~15 waking hours, inventing ~110 kcal on top of the
   walking itself. The same walk now moves this by exactly nothing. */
function idleMet(P){
  var v = pnum(P.metIdle, 1.25)
        + pnum(P.neatSlope, 0) * (habitualSteps() - pnum(P.stepsRef, 3500))/1000;
  return Math.max(1.10, Math.min(1.60, v));
}

/* Split the waking day into slices that cannot overlap. NEAT properly includes
   walking, so listing "NEAT" and "steps" as separate lump sums double-counted;
   the fix is to divide the MINUTES between them. Football steps leave the
   walking pool entirely, because the heart-rate model already prices those
   minutes far better than a step count can. */
function neatParts(d){
  var P = S.profile, x = peek(d) || {}, w = weightAt(d);
  var bmrMin   = bmrAt(d)/1440;
  var wakingMin= Math.max(0, pnum(P.wakingHours, 16) * 60);
  var allSteps = +x.steps || 0;
  var fb       = footballCalc(x.football, P, w, d);
  var fbSteps  = Math.min(allSteps, (fb && +x.football.steps) || 0);
  var walkSteps= Math.max(0, allSteps - fbSteps);

  /* Minutes: derived from distance and an assumed walking speed purely so the
     idle pool shrinks by a sensible amount. It no longer touches the energy. */
  var stepMin  = walkSteps * strideM(P) / 80;      // ~80 m/min, a normal pace
  var trainMin = (fb ? fb.mins : 0) + (x.gym ? (+P.gymMins||0) : 0);
  var idleMin  = Math.max(0, wakingMin - stepMin - trainMin);
  var mi       = idleMet(P);
  var per      = perStepKcal(P, w);

  /* Compensation: steps up to your habitual level are paid in full, steps
     above it at compFactor. */
  var hab   = habitualSteps();
  var baseSt= Math.min(walkSteps, hab);
  var exSt  = Math.max(0, walkSteps - hab);
  var comp  = Math.max(0.3, Math.min(1, pnum(P.compFactor, 1)));

  return {
    steps:allSteps, walkSteps:walkSteps, fbSteps:fbSteps,
    stepMin:stepMin, trainMin:trainMin, idleMin:idleMin, met:mi,
    hab:hab, baseSteps:baseSt, exSteps:exSt, comp:comp,
    walkRaw: walkSteps * per,
    walk: (baseSt + exSt*comp) * per,
    compSaved: exSt * per * (1-comp),

  if(logged.length < 10 || logged.length < span * 0.6) return false;

  var intake = 0, modeled = 0;
  /* .actual, not .total: comparing measured intake against a projected-TEF
     burn compares two different days. */
  logged.forEach(function(dd){ intake += eaten(dd).k; modeled += burn(dd, true).actual; });
  intake /= logged.length; modeled /= logged.length;
  if(modeled <= 0) return false;

  var kgPerDay = (first.avg - last.avg) / span;
  var trueTDEE = intake + kgPerDay * 7700;
  var factor = trueTDEE / modeled;

  /* 7700 kcal/kg is the energy in a kilo of FAT. Water and glycogen weigh the
     same and cost essentially nothing, so any window containing a glycogen
     swing — the first fortnight of a cut, a return to training, a big carb
     change — reads as a far larger deficit than you actually ran. Left
     unchecked this concludes the model UNDER-estimates your burn and offers
     to raise your targets, on the strength of water you already lost.

     So compare the measured rate against what the deficits actually in force
     could physically produce. Well outside that, and the window is telling
     you about body water, not about your metabolism. */
  var plannedPerDay = 0;
  logged.forEach(function(dd){ plannedPerDay += deficitFor(dd)/7700; });
  plannedPerDay = logged.length ? plannedPerDay/logged.length : 0;
  var ratio = plannedPerDay > 0 ? kgPerDay/plannedPerDay : 0;

  /* A fast rate on its own is AMBIGUOUS, and that is the trap. Losing quicker
     than the deficit predicts means either you dumped water, or the model
     genuinely under-counts your burn — and telling those apart is the entire
     point of this page, so we cannot just threshold the rate.

     What separates them is the SHAPE. Glycogen and its water leave once and
     do not come back, so a transient shows up as loss that is front-loaded
     and then decelerates. A model that is simply wrong produces the same
     excess rate in both halves of the window. So compare the halves. */
  var midDate = shift(first.d, Math.round(span/2)), mid = null;
  for(var mi=0; mi<ma.length; mi++)
    if(ma[mi].n >= 4 && ma[mi].d <= midDate) mid = ma[mi];

  var frontLoaded = false, r1 = null, r2 = null;
  if(mid && mid.d > first.d && mid.d < last.d){
    var d1 = dayDiff(mid.d, first.d), d2 = dayDiff(last.d, mid.d);
    if(d1 >= 4 && d2 >= 4){
      r1 = (first.avg - mid.avg) / d1;      // kg/day over the first half
      r2 = (mid.avg  - last.avg) / d2;      // kg/day over the second half
      /* decelerating sharply, and the early half beyond what calories allow */
      frontLoaded = r1 > Math.max(r2 * 1.5, r2 + 0.02) &&
                    plannedPerDay > 0 && r1 > plannedPerDay * 1.25;
    }
  }
  var suspect = plannedPerDay > 0 &&
                (frontLoaded || ratio > 2.0 || ratio < -0.5);

  return { intake:intake, modeled:modeled, trueTDEE:trueTDEE, factor:factor,
           clamped: Math.max(0.85, Math.min(1.15, factor)),
           days:logged.length, span:span, coverage: logged.length/(span+1),
           kgPerDay:kgPerDay, plannedPerDay:plannedPerDay, ratio:ratio,
           suspect:suspect, frontLoaded:frontLoaded, r1:r1, r2:r2,
           from:first.d, to:last.d };
}
function calFactor(){
  if(!S.profile.calibrate) return 1;
  var c = calibration();
  return c ? c.clamped : 1;
}
function eaten(d){
  var x=peek(d), t={k:0,p:0,c:0,f:0};
  if(!x || !x.entries) return t;
  x.entries.forEach(function(e){ t.k+=+e.k||0; t.p+=+e.p||0; t.c+=+e.c||0; t.f+=+e.f||0; });
  return t;
}

/* =================================================================
   PARSING WHAT YOU PASTE
   =================================================================
   Deliberately permissive, because the alternative is a skill whose only job
   is to reformat text into the one shape this app accepts. Markdown tables,
   bullet lists, numbered lists, bold, "650 kcal", "55 g protein", "55P 70C
   12F", "55/70/12", kJ, comma decimals, 2x multipliers and a bare calorie
   figure all land in the same place. If a line carries a number that could be
   food, it gets read. */

function stripMd(line){
  return String(line)
    .replace(/^\s*[>#]+\s*/, "")                 // quote / heading marks
    .replace(/^\s*(?:[-*\u2022\u00b7\u2013\u2014]|\d+[.)])\s+/, "")  // bullets, "1." , "2)"
    .replace(/\*\*|__|`/g, "")                    // bold / code
    .replace(/^\s*\|/, "").replace(/\|\s*$/, "")  // markdown table edges
    .trim();
}
/* Rows that are structure rather than food. */
function isNoiseLine(line){
  var t = line.toLowerCase().trim();
  if(!t) return true;
  if(/^[\s|:\-=_+]*$/.test(t)) return true;                       // |---|---|
  if(!/\d/.test(t)) return true;                                  // a header row
  /* \b sits between a word and a non-word character, and JavaScript counts
     "\u00e4" as a NON-word character outside Unicode mode — so "yhteens\u00e4 "
     had no boundary at all and a Finnish totals row was logged as food. */
  if(/^(?:total|totals|sum|summa|yhteens\u00e4|kaikki yhteens\u00e4|day total|daily total)(?![\w\u00c0-\u017f])/.test(t)) return true;
  /* A header row like "Name | kcal | protein | carbs | fat" is caught by the
     no-digits rule above. This extra rule exists for headers that DO contain a
     digit ("kcal per 100 g"), but it must not eat a food that happens to be
     called Item or Ruoka — so it only fires when the row has fewer than two
     genuinely numeric cells. */
  if(/^(name|item|food|ruoka|tuote)\s*[|\t;]/.test(t)){
    var cells = t.split(/\s*[|\t;]\s*/).slice(1);
    var numeric = cells.filter(function(c){ return /^\s*\d+(?:[.,]\d+)?\s*$/.test(c); }).length;
    if(numeric < 2) return true;
  }
  return false;
}
function num(x){
  var v = parseFloat(String(x).replace(/\u00a0/g," ").replace(",",".").replace(/[^\d.\-]/g,""));
  return isNaN(v) ? 0 : v;
}
/* `+P.x || d` falls back whenever x is zero, not just when it is missing, so a
   setting deliberately set to 0 silently reverted to its default. Harmless for
   most fields; wrong for any where 0 is a real choice. */
function pnum(v, dflt){ v = +v; return isFinite(v) ? v : dflt; }

function parseLine(line){
  line = stripMd(line);
  if(isNoiseLine(line)) return null;

  /* quantity: "2x", "2 x", "x2", "2 ×", and "0.5x" */
  var qty = 1, qm;
  if((qm = line.match(/^(\d+(?:[.,]\d+)?)\s*[x\u00d7]\s*/i))){
    qty = num(qm[1]); line = line.slice(qm[0].length);
  } else if((qm = line.match(/^[x\u00d7]\s*(\d+(?:[.,]\d+)?)\s+/i))){
    qty = num(qm[1]); line = line.slice(qm[0].length);
  }
  if(!(qty > 0)) qty = 1;

  /* ---- pipe / tab / semicolon delimited: Name | kcal | P | C | F ---- */
  if(/[|\t;]/.test(line)){
    var parts = line.split(/\s*[|\t;]\s*/).filter(function(p,i,a){
      return !(p === "" && (i === 0 || i === a.length-1));
    });
    var name = (parts[0] || "Item").trim();
    /* Empty cells keep their position. Filtering them out shifted every later
       column left, so "Shake | | 22 | 2 | 1.5" logged 22 kcal and 2 g of
       protein instead of a shake with 22 g of protein. */
    var cells = parts.slice(1);
    var nums = cells.map(num);
    if(cells.some(function(p){ return /\d/.test(p); })){
      var k0 = nums[0]||0, p0 = nums[1]||0, c0 = nums[2]||0, f0 = nums[3]||0;
      /* A table that lists macros but leaves kcal blank used to log 0 kcal —
         silently, so the day just looked good. Derive it instead. */
      if(!k0 && (p0||c0||f0)) k0 = p0*4 + c0*4 + f0*9;
      return {n:name||"Item", k:k0*qty, p:p0*qty, c:c0*qty, f:f0*qty};
    }
  }

  var rest = line, p=0, c=0, f=0, m;

  /* ---- "55P 70C 12F" / "55p/70c/12f" ---- */
  if((m = rest.match(/(\d+(?:[.,]\d+)?)\s*p\s*[\/,]\s*(\d+(?:[.,]\d+)?)\s*c\s*[\/,]\s*(\d+(?:[.,]\d+)?)\s*f\b/i))){
    p=num(m[1]); c=num(m[2]); f=num(m[3]); rest = rest.replace(m[0]," ");
  } else {
    /* labelled, either order: "55 g protein", "protein: 55g", "P 55" */
    var grab = function(re){
      var mm = rest.match(re);
      if(!mm) return 0;
      rest = rest.replace(mm[0]," ");
      return num(mm[1] !== undefined && /\d/.test(mm[1]) ? mm[1] : mm[2]);
    };
    p = grab(/(\d+(?:[.,]\d+)?)\s*g?\s*(?:prot(?:ein|eiini)?|p)\b/i)
     || grab(/(?:prot(?:ein|eiini)?|p)\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*g?\b/i);
    c = grab(/(\d+(?:[.,]\d+)?)\s*g?\s*(?:carb(?:s|ohydrates?)?|hiilihydraat\w*|c)\b/i)
     || grab(/(?:carb(?:s|ohydrates?)?|hiilihydraat\w*|c)\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*g?\b/i);
    f = grab(/(\d+(?:[.,]\d+)?)\s*g?\s*(?:fat|rasva\w*|f)\b/i)
     || grab(/(?:fat|rasva\w*|f)\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*g?\b/i);
  }

  /* ---- energy ---- */
  var k = 0;
  if((m = rest.match(/(\d+(?:[.,]\d+)?)\s*kj\b/i))){
    k = num(m[1]) / 4.184; rest = rest.replace(m[0]," ");
  } else if((m = rest.match(/(\d+(?:[.,]\d+)?)\s*(?:kcal|cals?|calories|kalori\w*)\b/i))){
    k = num(m[1]); rest = rest.replace(m[0]," ");
  } else if((m = rest.match(/(?:kcal|energy|energia)\s*[:=]?\s*(\d+(?:[.,]\d+)?)/i))){
    k = num(m[1]); rest = rest.replace(m[0]," ");
  } else {
    /* a bare number, but not one glued to a unit that clearly isn't energy */
    var an = rest.match(/(?:^|\s)(\d+(?:[.,]\d+)?)(?!\s*(?:g\b|ml\b|dl\b|kg\b|%|cm\b))(?=\s|$)/);
    if(an){ k = num(an[1]); rest = rest.replace(an[0]," "); }
  }

  /* "3 slices" or "250 g" left in the name is useful context, so tidy rather
     than strip. Pulling the numbers out of "Rahka (30P/10C/1F)" leaves an
     empty bracket behind, so collapse those too. */
  var nm = rest.replace(/\(\s*[\/,;.\-]*\s*\)/g," ")     // ( ) and ( / / )
               .replace(/\[\s*[\/,;.\-]*\s*\]/g," ")
               .replace(/[,\-\u2013\u2014:]+/g," ")
               .replace(/\s*\/\s*/g, " ")
               .replace(/\s{2,}/g," ").trim();
  nm = nm.replace(/^[\s.()\[\]]+|[\s.()\[\]]+$/g,"") || "Item";

  if(!k && !p && !c && !f) return null;
  if(!k) k = p*4 + c*4 + f*9;
  return {n:nm, k:k*qty, p:p*qty, c:c*qty, f:f*qty};
}
function parseBlock(text){
  return String(text).replace(/\r/g,"").split("\n").map(parseLine).filter(Boolean);
}

/* Both of these are cached, and the average is a single pass.
   They were not, and it mattered: weightAt() is called once per day inside
   the calibration loop, movingAvg() was O(n²) via a filter inside a map, and
   every keystroke in the step field called save() → invalidate → a full
   recompute over your entire history. On a few hundred weigh-ins that is
   visible input lag on a phone. */
var _swCache = null, _maCache = null;
function invalidateMA(){ _swCache = null; _maCache = null; }
function sortedWeights(){
  if(_swCache) return _swCache;
  _swCache = S.weights.filter(function(q){ return q && q.d && +q.w > 0; })
                      .sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  return _swCache;
}
function movingAvg(arr, days){
  if(days === 7 && arr === _swCache && _maCache) return _maCache;
  var out = [], sum = 0, lo = 0;
  for(var i=0;i<arr.length;i++){
    sum += arr[i].w;
    var from = shift(arr[i].d, -(days-1));
    while(lo < i && arr[lo].d < from){ sum -= arr[lo].w; lo++; }
    var n = i - lo + 1;
    out.push({d:arr[i].d, w:arr[i].w, avg:sum/n, n:n});
  }
  if(days === 7 && arr === _swCache) _maCache = out;
  return out;
}
function weeklyRate(){
  var arr = sortedWeights();
  if(arr.length < 4) return null;
  var ma = movingAvg(arr, 7);
  var last = ma[ma.length-1];
  var target = shift(last.d, -7);
  var best=null, bestGap=1e9;
  ma.forEach(function(p){
    var gap = Math.abs(dayDiff(p.d, target));
    if(gap < bestGap){ bestGap=gap; best=p; }
  });
  if(!best || best.d === last.d) return null;
  var span = dayDiff(last.d, best.d);
  if(span < 3) return null;
  return {rate:(best.avg - last.avg) / span * 7, span:span, from:best, to:last, points:arr.length};
}
function dayDiff(a,b){
  var pa=a.split("-"), pb=b.split("-");
  return Math.round((new Date(+pa[0],+pa[1]-1,+pa[2]) - new Date(+pb[0],+pb[1]-1,+pb[2]))/86400000);
}

/* Waist is measured every few days rather than daily, so this compares the
   latest reading against the furthest one still inside a 28-day window that
   is at least 4 days older — enough separation for the change to mean
   something, close enough to still be current. */
function waistTrend(){
  var arr = S.waist.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  if(arr.length < 2) return null;
  var last = arr[arr.length-1], ref = null;
  for(var i=0;i<arr.length-1;i++){
    var gap = dayDiff(last.d, arr[i].d);
    if(gap >= 4 && gap <= 28){ ref = arr[i]; break; }
  }
  if(!ref){
    var prev = arr[arr.length-2];
    if(dayDiff(last.d, prev.d) < 2) return null;
    ref = prev;
  }
  return {cm:last.cm, delta:last.cm - ref.cm, days:dayDiff(last.d, ref.d),
          from:ref, points:arr.length};
}

/* =================================================================
   MOTION
   A spring is parameterised the way Apple exposes it — damping
   ratio and response — rather than mass/stiffness/damping, because
   those two map onto what you actually want to feel.

   Critically, retargeting keeps the CURRENT value and velocity.
   That is what makes an animation grabbable mid-flight without a
   jump, and what stops a reversal hitting a velocity brick wall.
   ================================================================= */
var reduceMotion = window.matchMedia
  ? window.matchMedia("(prefers-reduced-motion: reduce)")
  : {matches:false, addEventListener:function(){}};

function Spring(value, opts){
  opts = opts || {};
  this.value = value; this.target = value; this.velocity = 0;
  this.damping = opts.damping !== undefined ? opts.damping : 1.0;  // 1.0 = no overshoot
  this.response = opts.response !== undefined ? opts.response : 0.4;
  this.onUpdate = opts.onUpdate || function(){};
  this.onRest = opts.onRest || null;
  this.epsilon = opts.epsilon || 0.0015;
  this.resting = true;
}
Spring.prototype.set = function(v){   // hard set, no animation
  this.value = this.target = v; this.velocity = 0; this.resting = true;
  this.onUpdate(this.value);
};
Spring.prototype.to = function(target, velocity){
  this.target = target;
  if(velocity !== undefined) this.velocity = velocity;
  if(reduceMotion.matches){ this.set(target); return this; }
  if(this.resting){ this.resting = false; Driver.add(this); }
  return this;
};
Spring.prototype.nudge = function(v){ // add velocity without changing target
  this.velocity += v;
  if(this.resting){ this.resting = false; Driver.add(this); }
};
Spring.prototype.tick = function(dt){
  var w = 2*Math.PI/this.response, z = this.damping;
  // fixed sub-steps keep the integration stable when a frame is long
  var steps = Math.min(8, Math.max(1, Math.ceil(dt/0.004)));
  var h = dt/steps;
  for(var i=0;i<steps;i++){
    var a = -w*w*(this.value - this.target) - 2*z*w*this.velocity;
    this.velocity += a*h;
    this.value += this.velocity*h;
  }
  var scale = Math.max(1, Math.abs(this.target));
  if(Math.abs(this.value - this.target) < this.epsilon*scale &&
     Math.abs(this.velocity) < this.epsilon*scale*4){
    this.value = this.target; this.velocity = 0; this.resting = true;
    this.onUpdate(this.value);
    if(this.onRest) this.onRest();
    return false;
  }
  this.onUpdate(this.value);
  return true;
};

var Driver = {
  springs: [], running:false, last:0,
  add: function(s){
    if(this.springs.indexOf(s) === -1) this.springs.push(s);
    if(!this.running){ this.running = true; this.last = performance.now();
      requestAnimationFrame(this.frame.bind(this)); }
  },
  frame: function(now){
    var dt = Math.min(0.064, (now - this.last)/1000);   // clamp after a background tab
    this.last = now;
    for(var i=this.springs.length-1; i>=0; i--){
      if(!this.springs[i].tick(dt)) this.springs.splice(i,1);
    }
    if(this.springs.length){ requestAnimationFrame(this.frame.bind(this)); }
    else this.running = false;
  }
};

/* Momentum projection — Apple's exponential-decay form, not the
   textbook v²/2a. This is what makes a flick land where the gesture
   was actually heading. */
function project(velocity, decelerationRate){
  var d = decelerationRate === undefined ? 0.998 : decelerationRate;
  return (velocity/1000) * d / (1 - d);
}
/* Progressive resistance at a boundary: the further past, the less
   it follows. A hard stop reads as frozen; this reads as "nothing
   more here". */
function rubberband(overshoot, dimension, constant){
  var c = constant === undefined ? 0.55 : constant;
  return (overshoot * dimension * c) / (dimension + c * Math.abs(overshoot));
}
/* Velocity tracker — a short history, because the instantaneous
   delta between two events is far too noisy to hand to a spring. */
function Tracker(){ this.pts = []; }
Tracker.prototype.push = function(v){
  var t = performance.now();
  this.pts.push({v:v, t:t});
  while(this.pts.length > 6 || (this.pts.length > 2 && t - this.pts[0].t > 100)) this.pts.shift();
};
Tracker.prototype.velocity = function(){
  if(this.pts.length < 2) return 0;
  var a = this.pts[0], b = this.pts[this.pts.length-1];
  var dt = (b.t - a.t)/1000;
  return dt > 0.001 ? (b.v - a.v)/dt : 0;
};
Tracker.prototype.reset = function(){ this.pts.length = 0; };

function haptic(ms){ // silently absent on iOS Safari
  if(navigator.vibrate) try{ navigator.vibrate(ms||8); }catch(e){}
}

/* =================================================================
   PRESS — feedback on pointer-down, with drag-away cancel and a
   ~12px hysteresis so a scroll that starts on a row doesn't flash it.
   ================================================================= */
document.addEventListener("pointerdown", function(e){
  var t = e.target.closest && e.target.closest("[data-press]");
  if(!t) return;
  var sx = e.clientX, sy = e.clientY, done = false;
  t.classList.add("pressing");
  function off(){
    if(done) return; done = true;
    t.classList.remove("pressing");
    document.removeEventListener("pointermove", move, true);
    document.removeEventListener("pointerup", off, true);
    document.removeEventListener("pointercancel", off, true);
  }
  function move(ev){
    if(Math.abs(ev.clientX-sx) > 12 || Math.abs(ev.clientY-sy) > 12) off();
  }
  document.addEventListener("pointermove", move, true);
  document.addEventListener("pointerup", off, true);
  document.addEventListener("pointercancel", off, true);
}, true);

/* =================================================================
   TOAST — materialises rather than fading (§12)
   ================================================================= */
var toastSpring = null, toastTimer = null;
function toast(msg){
  var t = el("toast");
  t.textContent = msg;
  if(!toastSpring){
    toastSpring = new Spring(0, {damping:0.85, response:0.35, onUpdate:function(v){
      t.style.opacity = Math.max(0, Math.min(1, v));
      t.style.transform = "translateX(-50%) translateY("+((1-v)*14).toFixed(2)+"px) scale("+(0.94+0.06*v).toFixed(3)+")";
    }});
    toastSpring.set(0);
  }
  toastSpring.to(1);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastSpring.to(0); }, 1900);
}

/* =================================================================
   VIEW MARKUP
   ================================================================= */
function ringSVG(size, stroke, color){
  var r = (size - stroke)/2, cx = size/2, C = 2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--fill)" stroke-width="'+stroke+'"/>'+
    '<circle class="js-ring" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+color+
      '" stroke-width="'+stroke+
      '" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+
      '" transform="rotate(-90 '+cx+' '+cx+')"/></svg>';
}
var RING_C = 2*Math.PI*((104-11)/2);

/* ONE painter, for the live pane and for the neighbours sliding in under your
   finger alike. These used to be two near-identical functions (fillPane and
   syncToday) that had already drifted apart — the offscreen panes never got
   the same treatment as the live one — so every change had to be made twice
   and one copy was always subtly wrong. `sp` present means animate through
   the springs; absent means write the values straight in, which is what a
   pane arriving into view needs. */
function paintPane(pane, d, sp, instant){
  if(!pane) return;
  var P=S.profile, b=burn(d), e=b.eaten;
  var target = b.target;
  var left   = target - e.k;
  var frac   = target>0 ? e.k/target : 0;
  var np     = b.np;

  if(sp){
    var go = instant ? "set" : "to";
    sp.ring[go](frac);
    sp.num[go](Math.abs(left));
    sp.p[go](P.proteinTarget ? e.p/P.proteinTarget : 0);
    sp.c[go](Math.min(1, e.c/300));
    sp.f[go](Math.min(1, e.f/110));
    sp.k[go](frac);
  } else {
    var ring = pane.querySelector(".js-ring");
    if(ring){
      ring.setAttribute("stroke-dashoffset", RING_C*(1-Math.max(0,Math.min(1,frac))));
      ring.setAttribute("stroke", frac > 1 ? "var(--red)" : "var(--blue)");
    }
    setText(pane, ".js-ringnum", Math.round(Math.abs(left)));
    setBar(pane,"p", P.proteinTarget ? e.p/P.proteinTarget : 0, null);
    setBar(pane,"c", Math.min(1, e.c/300), null);
    setBar(pane,"f", Math.min(1, e.f/110), null);
    setBar(pane,"k", frac, null);
  }

  setText(pane, ".js-ringlbl", left >= 0 ? "left" : "over");
  setText(pane, '.js-qt[data-m="p"]', Math.round(e.p)+" / "+P.proteinTarget+"g");
  setText(pane, '.js-qt[data-m="c"]', Math.round(e.c)+"g");
  setText(pane, '.js-qt[data-m="f"]', Math.round(e.f)+"g");
  setText(pane, ".js-ringof", Math.round(e.k)+" / "+Math.round(target));

  /* ---- walking ---- */
  setText(pane, ".js-stepkcal", Math.round(b.steps));
  var sub = np.fbSteps > 0
    ? Math.round(np.walkSteps).toLocaleString()+" on foot (\u2212"+
      Math.round(np.fbSteps).toLocaleString()+" in the match)"
    : Math.round(np.walkSteps).toLocaleString()+" steps";
  sub += np.exSteps > 0
    ? " \u00b7 "+Math.round(np.exSteps).toLocaleString()+" over your usual "+
      Math.round(np.hab).toLocaleString()+", at "+Math.round(np.comp*100)+"%"
    : (np.hab > 0 ? " \u00b7 usual "+Math.round(np.hab).toLocaleString() : "");
  sub += " \u00b7 "+(Math.round(np.perStep*1000)/1000)+"/step";
  setText(pane, ".js-stepsub", sub);

  /* ---- idle ---- */
  setText(pane, ".js-idle", Math.round(b.neat));
  setText(pane, ".js-idlesub", n1(np.idleMin/60)+" h awake, not walking or training \u00b7 "+
    n2(np.met)+" MET, from your habitual "+Math.round(np.hab).toLocaleString()+" steps");

  /* ---- BMR ---- */
  setText(pane, ".js-bmr", Math.round(b.bmr));
  setText(pane, ".js-bmrsub", bmrBasis(d));

  /* ---- TEF: measured so far, plus what's left to earn ---- */
  setText(pane, ".js-tef", Math.round(b.tef));
  setText(pane, ".js-tefsub",
    Math.round(b.tefEarned)+" measured from what you\u2019ve logged"+
    (b.tefLeft > 0.5
      ? " + "+Math.round(b.tefLeft)+" projected on the "+
        Math.round(Math.max(0,target-e.k))+" kcal still to eat"
      : " \u00b7 fully measured, nothing estimated")+
    " \u00b7 protein 25%, carbs 7.5%, fat 2.5%");

  setText(pane, ".js-outtot", Math.round(b.total));
  setText(pane, ".js-palx", n1(b.pal));

  /* The composition bar. Ordered coolest-first so the ramp reads as heat:
     what you burn lying still, then incidental movement, then walking, then
     deliberate training, then digestion off the end of the ramp. */
  var parts = [
    {k:"Resting",  v:b.bmr,      c:"var(--char)"},
    {k:"Awake",    v:b.neat,     c:"var(--ember-lo)"},
    {k:"Walking",  v:b.steps,    c:"var(--ember)"},
    {k:"Training", v:b.gym + b.football, c:"var(--ember-hi)"},
    {k:"Digesting",v:b.tef,      c:"var(--ash)"}
  ];
  var sum = parts.reduce(function(a,p){ return a + Math.max(0,p.v); }, 0) || 1;
  var barEl = pane.querySelector(".js-compbar");
  if(barEl){
    barEl.innerHTML = parts.map(function(p){
      var pc = Math.max(0, p.v)/sum*100;
      return pc < 0.4 ? "" :
        '<i style="width:'+pc.toFixed(2)+'%;background:'+p.c+'" title="'+p.k+'"></i>';
    }).join("");
  }
  var legEl = pane.querySelector(".js-complegend");
  if(legEl){
    legEl.innerHTML = parts.map(function(p){
      var pc = Math.max(0, p.v)/sum*100;
      if(pc < 0.4) return "";
      return '<span><i style="background:'+p.c+'"></i>'+p.k+' '+Math.round(pc)+'%</span>';
    }).join("");
  }

  var cmp = pane.querySelector(".js-comprow");
  if(cmp) cmp.style.display = np.compSaved > 0.5 ? "" : "none";
  setText(pane, ".js-comp", "\u2212"+Math.round(np.compSaved));

  var palEl = pane.querySelector(".js-pal");
  if(palEl) palEl.innerHTML = 'That is <b>'+n1(b.pal)+'\u00d7</b> your resting rate. '+
    'For reference: complete bedrest \u22481.2, sedentary day 1.4\u20131.5, hard training day 2+.';

  /* Only ONE number is allowed to be loud per screen, and the ring owns it.
     This line used to bold all three figures, so the eye had nowhere to land. */
  var bl = pane.querySelector(".js-burnline");
  if(bl) bl.innerHTML = 'Burn '+Math.round(b.total)+' \u2212 deficit '+
    Math.round(b.deficit)+' = eat <b>'+Math.round(target)+'</b> kcal'+
    (target<1500?' <span class="pill o">low day</span>':'')+
    '<div class="t-cap" style="color:var(--label3);margin-top:3px">'+deficitWhy(d)+'</div>';

  var ac = pane.querySelector(".js-actual");
  if(ac){
    if(e.k <= 0){
      ac.innerHTML = 'Nothing logged yet, so the digestion figure above is still all projection.';
    } else {
      var bonus = b.tefEarned - b.tefRate * e.k;
      ac.innerHTML = 'Actually burned so far, on the food you\u2019ve logged: <b>'+
        Math.round(b.actual)+'</b> kcal \u2014 real deficit <b>'+
        Math.round(b.actual - e.k)+'</b>.'+
        (bonus > 20 ? ' Your macros are running higher-protein than the target assumes, '+
          'which is earning you about '+Math.round(bonus)+' kcal of extra digestion cost.' :
         bonus < -20 ? ' Your macros are lighter on protein than the target assumes, so '+
          'digestion is costing about '+Math.round(-bonus)+' kcal less than projected.' : '');
    }
  }
}

/* Where the day's deficit came from, in words — so a number that changes on
   its own is never mysterious. */
function deficitWhy(d){
  var x = peek(d);
  if(x && x.deficit !== undefined && d !== today)
    return "Locked at "+Math.round(x.deficit)+" \u2014 the deficit that was in force that day.";
  var win = planWindowFor(d);
  if(win) return "Maintenance window" + (win.label ? " ("+esc(win.label)+")" : "") + ".";
  if(!S.plan || S.plan.mode !== "auto") return "Set by hand in Setup.";
  var tw = trendWeightAt(d), b = planBandFor(tw);
  var idx = (S.plan.bands||[]).indexOf(b);
  return b ? ("Plan phase "+bandLabel(idx)+", from a trend weight of "+n1(tw)+" kg.")
           : "From your plan.";
}
function bmrBasis(d){
  var P = S.profile;
  if(P.bmrMode === "manual") return "set by hand, all 24 h";
  if(P.bmrMode === "katch" && +P.leanMass > 0)
    return "Katch-McArdle on "+n1(P.leanMass)+" kg lean, all 24 h";
  return "Mifflin-St Jeor at "+n1(weightAt(d))+" kg, all 24 h";
}

function fillPane(pane, d){ paintPane(pane, d, null, true); }
function setText(scope, sel, v){ var n = scope.querySelector(sel); if(n) n.textContent = v; }
function setBar(scope, key, frac, label){
  var b = scope.querySelector('.js-bar[data-m="'+key+'"]');
  if(b) b.style.transform = "scaleX("+Math.max(0, Math.min(1, frac)).toFixed(4)+")";
  var q = scope.querySelector('.js-qt[data-m="'+key+'"]');
  if(q && label !== null) q.textContent = label;
}
function numRow(label, sub, val, oninput, step, suffix){
  /* inputmode matters on a phone: type=number on its own gives iOS the full
     alphanumeric keyboard with a cramped number row. "numeric" is the plain
     keypad for whole numbers, "decimal" adds the separator. */
  var mode = (step === "1" || step === "5" || step === "10" || step === "25" ||
              step === "100" || step === "250") ? "numeric" : "decimal";
  return '<label class="row"><div class="grow"><div class="ttl t-body">'+label+'</div>'+
    (sub?'<div class="sub2 t-foot">'+sub+'</div>':'')+'</div>'+
    '<input type="number" inputmode="'+mode+'" enterkeyhint="done" '+
      'step="'+(step||"any")+'" value="'+val+'" oninput="'+oninput+'">'+
    (suffix?'<span class="val t-body" style="flex:0 0 auto">'+suffix+'</span>':'')+'</label>';
}

/* The mark is the app icon that is ALREADY in <head> as a data URI — read
   back off the <link> rather than embedded a second time, so it costs no
   extra bytes and swapping the icon automatically updates the header too. */
function renderTopbar(){
  var bar = el("topbar"); if(!bar) return;
  var lnk = document.querySelector('link[rel="apple-touch-icon"], link[rel="icon"]');
  var src = lnk && lnk.getAttribute("href");
  var mark = src
    ? '<img class="mark" src="'+src+'" alt="" aria-hidden="true">'
    /* fallback if the icon is ever removed: the calorie ring as a mark */
    : '<svg class="mark" viewBox="0 0 32 32" aria-hidden="true">'+
        '<circle cx="16" cy="16" r="12.5" fill="none" stroke="var(--char)" stroke-width="4.2"/>'+
        '<path d="M16 3.5a12.5 12.5 0 0 1 11.4 7.4" fill="none" stroke="var(--ember-hi)" '+
          'stroke-width="4.2" stroke-linecap="round"/>'+
        '<circle cx="16" cy="16" r="3.1" fill="var(--ember-hi)"/></svg>';

  var win = planWindowFor(today);
  var band = win || planBandFor(trendWeightAt(today));
  var sub = !band ? ""
    : esc(win ? (win.label || "maintenance")
              : bandLabel((S.plan.bands||[]).indexOf(band))) +
      " \u00b7 " + Math.round(deficitFor(today)) + " kcal";

  bar.innerHTML = mark +
    '<span class="word">Hiillos</span>' +
    '<span class="spacer"></span>' +
    (sub ? '<span class="phase">'+sub+'</span>' : '');
}

/* ---------- Today: targeted updates, no innerHTML rebuild ----------
   Typing a step count must not tear down and rebuild the DOM. It
   patches the handful of nodes that actually changed, which is why
   focus is never stolen and there is no perceptible input latency. */
/* Everything below resolves elements by class within the LIVE pane rather
   than by global id. That's what lets a neighbouring pane be promoted to
   become the current one after a swipe — no ids to rename, no re-render. */
var todaySprings = null;
function livePane(){ return el("root"); }

function initTodaySprings(){
  var pane = livePane(); if(!pane) return;
  var ring = pane.querySelector(".js-ring");
  var num  = pane.querySelector(".js-ringnum");
  if(!ring || !num){ todaySprings = null; return; }
  todaySprings = {
    ring: new Spring(0, {damping:1.0, response:0.45, onUpdate:function(v){
      ring.setAttribute("stroke-dashoffset", RING_C * (1 - Math.max(0, Math.min(1, v))));
      ring.setAttribute("stroke", v > 1 ? "var(--red)" : "var(--blue)");
    }}),
    num: new Spring(0, {damping:1.0, response:0.5, onUpdate:function(v){
      num.textContent = Math.round(Math.abs(v));
    }}),
    p: barSpring(pane,"p"), c: barSpring(pane,"c"),
    f: barSpring(pane,"f"), k: barSpring(pane,"k")
  };
}
function barSpring(pane, m){
  var b = pane.querySelector('.js-bar[data-m="'+m+'"]');
  return new Spring(0, {damping:1.0, response:0.42, onUpdate:function(v){
    if(b) b.style.transform = "scaleX("+Math.max(0, Math.min(1, v)).toFixed(4)+")";
  }});
}
/* instant=true writes the values straight in with no animation — used when
   a pane arrives already showing the right numbers. */
function syncToday(instant){
  if(view !== "today") return;
  var pane = livePane(); if(!pane) return;
  if(!todaySprings || !pane.querySelector(".js-ring")) initTodaySprings();
  paintPane(pane, cur, todaySprings, instant);
}
function refreshEntries(){
  var pane = livePane(); if(!pane) return;
  var c = pane.querySelector(".js-entries");
  if(c) c.innerHTML = entriesHTML(cur);
  syncToday();
  Ghosts.invalidate();
}

        fb.steps||0, "setFb('steps',this.value)", "100", "");

  h += '<div id="fbresult">'+fbResultHTML(r, P)+'</div>';

  h += '<h2 class="t-section" style="margin:26px 0 8px 4px">Your presets</h2><div class="card">'+
    presetRow("Chill with friends","2 h · avg 110 bpm",120,110)+
    presetRow("Hard game","2 h · avg 150 bpm",120,150)+
    presetRow("Normal game","90 min · avg 140 bpm",90,140)+
  '</div>';

  h += '<h2 class="t-section" style="margin:26px 0 8px 4px">Heart rate settings</h2><div class="card">'+
    numRow("Resting HR","Fitbit shows this on the heart tab", P.restHR, "setP('restHR',this.value)", "1", "bpm")+
    numRow("Max HR","for %HRR \u00b7 Tanaka (208 \u2212 0.7 \u00d7 age) = "+
      Math.round(208-0.7*(+P.age||30))+" \u00b7 raise it if you've genuinely seen higher",
      P.maxHR, "setP('maxHR',this.value)", "1", "bpm")+
    numRow("Zone basis HR","what your watch used to draw its zones \u00b7 Fitbit uses 220 \u2212 age = "+
      (220-(+P.age||30))+" \u00b7 0 to follow that automatically",
      P.zoneBasisHR, "setP('zoneBasisHR',this.value)", "1", "bpm")+
    numRow("VO₂max","Fitbit calls this Cardio Fitness Score", P.vo2max, "setP('vo2max',this.value)", "1", "")+
    numRow("Safety margin","deliberate under-estimate", P.margin, "setP('margin',this.value)", "1", "%")+
  '</div><div style="height:20px"></div>';
  return h;
}
function presetRow(title, sub, mins, hr){

/* The segmented thumb slides with a spring rather than a CSS
   transition, so tapping the other side mid-slide redirects it
   from where it currently is instead of jumping. */
var segSpring = null;
function positionSeg(animate){
  var seg = el("fbseg"), thumb = el("fbthumb");

  var idx = fbMode==="avg" ? 0 : 1;

    }});

/* Pasting a meal into Today logs it but doesn't add it to the library, which
   means the things you actually eat most often are the ones least likely to
   be saved. This surfaces what you've logged repeatedly and isn't in the
   library yet, so it's one tap to keep. */
function normName(n){
  return String(n||"").toLowerCase().trim().replace(/\s*\([^)]*\)\s*$/, "").trim();
}
function recentLogged(){
  var lib = {}, seen = {};
  S.foods.forEach(function(f){ lib[normName(f.n)] = 1; });
  for(var i=0;i<30;i++){
    var x = S.days[shift(today, -i)];
    if(!x || !x.entries) continue;
    x.entries.forEach(function(en){
      var key = normName(en.n);
      if(!key || lib[key]) return;
      if(!seen[key]) seen[key] = {n:String(en.n).replace(/\s*\([^)]*\)\s*$/,"").trim(),
                                  k:en.k, p:en.p, c:en.c, f:en.f, count:0};
      seen[key].count++;
    });
  }
  return Object.keys(seen).map(function(k){ return seen[k]; })
    .sort(function(a,b){ return b.count - a.count || String(a.n).localeCompare(String(b.n)); })
    .slice(0, 12);
}
var _recent = [];
function renderRecents(){
  var c = el("recentlist"); if(!c) return;
  _recent = recentLogged();
  if(!_recent.length){ c.innerHTML = ""; return; }
  var h = '<h2 class="t-section" style="margin:26px 0 8px 4px">Logged but not saved</h2>'+
    '<div class="card">';
  _recent.forEach(function(f,i){
    h += '<div class="row ctl" data-press><div class="grow">'+
      '<div class="ttl t-body">'+esc(f.n)+'</div>'+
      '<div class="sub2 t-foot">'+f.count+'× in 30 days · '+n1(f.p)+'P '+n1(f.c)+'C '+n1(f.f)+'F</div></div>'+
      '<span class="val t-body">'+Math.round(f.k)+'</span>'+
      '<button class="add" onclick="keepRecent('+i+')">Keep</button></div>';
  });
  c.innerHTML = h + '</div>';
}
function keepRecent(i){
  var f = _recent[i]; if(!f) return;
  S.foods.push({id:uid(), n:f.n, u:"", k:f.k, p:f.p, c:f.c, f:f.f});
  save(); renderFoodList(); renderRecents();
  toast(f.n+" saved to your library");
}

function viewTrends(){

      n1(atBF)+' kg</span></div>':'')+
    '<div class="kv"><span>To go</span><span>'+n1(Math.max(0,w-(+P.goalWeight||84)))+' kg</span></div>'+
    '<div class="kv tot"><span>On the plan above</span><span>'+etaText()+'</span></div>'+
    (lean?'<div class="note" style="border-top:.5px solid var(--sep)">Holding all '+n1(lean)+
      ' kg of lean mass, '+P.goalBF+'% lands you at <b>'+n1(atBF)+' kg</b> and 16% at <b>'+
      n1(lean/0.84)+' kg</b>. Shed 1\u20132 kg of lean on the way down \u2014 which is normal '+
      'even done well \u2014 and those come in about a kilo lower. Bear in mind a bioimpedance '+

  '</div>';
  h += '<h2 class="t-section" style="margin:26px 0 8px 4px">Last 7 days</h2><div class="card">'+ledger()+'</div>';

/* The model is a good estimate. Your body is the measurement. Once there's
   enough history, this compares the two and lets the measurement win. */
function calibrationSection(){
  var c = calibration(), P = S.profile;
  var h = '<h2 class="t-section" style="margin:26px 0 8px 4px">Measured burn</h2><div class="card">';

              'this window and '+n1(c.r2*7)+' across the second. Fat does not come off in that '+
              'shape \u2014 a steady deficit gives a steady rate. Losing fast and then '+

        'Worked back from '+c.days+' logged days across '+c.span+' days of weigh-ins: what you ate, '+
        'plus the energy in the weight that came off. '+
        (Math.abs(off) < 4
          ? 'That\'s close enough that the model is doing its job — no correction needed.'
          : 'Turning the correction on multiplies your burn by ×'+n1(c.clamped)+
            ', so your daily target follows what your body actually does instead of the formulas.')+
      '</div>'+
      '<div style="margin-top:11px"><button class="btn '+(on?'danger':'sec')+' ctl" data-press '+
