}
function toggleCal(){
  S.profile.calibrate = S.profile.calibrate ? 0 : 1;
  S.pm = Date.now(); save(); render();
  toast(S.profile.calibrate ? "Using your measured burn" : "Back to the model");
}

/* Waist read against the scale. This is the pairing that actually tells you
   what's happening: the scale moves with water and glycogen, the waist
   doesn't. When they disagree, the waist is usually the honest one. */
function waistSection(wr){
  var wt = waistTrend();
  var h = '<h2 class="t-section" style="margin:26px 0 8px 4px">Waist</h2><div class="card">';
  if(!wt){
    var n = S.waist.length;
    return h + '<div class="empty">'+(n ? "One reading so far ("+n1(S.waist[S.waist.length-1].cm)+
      " cm). Measure again in about a week and this starts working."
      : "Log it on the Today tab and it shows up here.")+'</div></div>';
  }
  var d = wt.delta, P = S.profile;
  var pill = d <= -0.3 ? '<span class="pill g">'+n1(d)+' cm</span>'
           : d >= 0.3  ? '<span class="pill r">+'+n1(d)+' cm</span>'
           : '<span class="pill o">'+(d>0?"+":"")+n1(d)+' cm · flat</span>';

  var msg;
  var rate = wr ? wr.rate : null;
  var tr = targetRate();
  if(rate !== null && rate < tr.low && d <= -0.3){
    msg = "The scale is under your target rate but the waist is still coming down. "+
      "That's fat loss the scale is hiding behind water — completely normal on a deficit, "+
      "especially around hard football days. Don't cut calories on the back of this.";
  } else if(rate !== null && rate > tr.high && Math.abs(d) < 0.3){
    msg = "Weight is dropping faster than target but the waist has barely moved. "+
      "Fast loss without a shrinking waist is usually water and lean mass rather than fat. "+
      "Worth eating a bit more and checking protein is hitting "+P.proteinTarget+" g.";
  } else if(d <= -0.3 && rate !== null && rate >= tr.low && rate <= tr.high){
    msg = "Waist and scale are moving together. That's exactly what a well-run cut looks like — "+
      "nothing to change.";
  } else if(d >= 0.3){
    msg = "Waist is up over "+wt.days+" days. One reading can be off if you measured at a "+
      "different spot or after a big meal, so re-measure tomorrow morning before reading anything into it.";
  } else {
    msg = "Waist is holding steady. Over a couple more weeks it should track your weight down; "+
      "if the scale falls and this doesn't, the loss isn't mostly fat.";
  }
  return h +
    '<div class="kv"><span>Now</span><span>'+n1(wt.cm)+' cm</span></div>'+
    '<div class="kv"><span>Change over '+wt.days+' days</span><span>'+
      (d>0?"+":"")+n1(d)+' cm</span></div>'+
    '<div style="padding:12px 16px;border-top:.5px solid var(--sep)">'+
      '<div style="margin-bottom:7px">'+pill+'</div>'+
      '<div class="t-sub" style="color:var(--label2);line-height:1.5">'+msg+'</div>'+
    '</div></div>';
}
/* "On target" is now derived from the deficit actually in force, not from a
   fixed 0.7-0.9 kg/wk. Under the old fixed band, every later phase of your
   plan — which deliberately aims at 0.45 and then 0.35 kg/wk — would have
   been permanently flagged as too slow, and the advice card would have told
   you to cut further for months. */
function ratePill(rate){
  var tr = targetRate();
  var t = n1(rate)+" kg/week";
  if(rate < 0) return '<span class="pill r">gaining '+n1(-rate)+' kg/week</span>';
  if(rate < tr.low)  return '<span class="pill o">'+t+' · slower than the '+n1(tr.mid)+' this deficit implies</span>';
  if(rate > tr.high) return '<span class="pill o">'+t+' · faster than the '+n1(tr.mid)+' this deficit implies</span>';
  return '<span class="pill g">'+t+' · on target</span>';
}
function adviceCard(wr, P){
  var tr = targetRate();
  var rate = wr.rate, mid = tr.mid;
  var adj = -(rate - mid) * 7700 / 7;
  adj = Math.max(-300, Math.min(300, Math.round(adj/25)*25));
  var msg;
  if(rate >= tr.low && rate <= tr.high){
    msg = "You're inside your target band. Don't change anything — the numbers you're using are working, "+
      "whatever the individual parts say.";
  } else if(rate < tr.low){
    msg = (rate<0?"The scale is going up. ":"You're losing slower than this phase intends. ")+
      "The likeliest cause is intake being under-counted rather than burn being wrong — sauces, oil, drinks, "+
      "bites while cooking. Check those before cutting further. If it holds another week, drop intake by about "+
      Math.abs(adj)+" kcal/day.";
  } else {
    msg = "You're losing faster than this phase intends. On a "+Math.round(tr.deficit)+
      " deficit that's worth correcting, "+
      "not celebrating — fast loss above about 1 kg/week starts costing lean mass and recovery. Add roughly "+
      Math.abs(adj)+" kcal/day, mostly carbs around football.";
  }
  return '<div class="card"><div style="padding:14px 16px">'+
    '<div class="t-head" style="margin-bottom:5px">What to do</div>'+
    '<div class="t-sub" style="color:var(--label2);line-height:1.5">'+msg+'</div>'+
    '<div class="t-cap" style="color:var(--label3);margin-top:9px">Based on '+wr.span+
      ' days of 7-day averages, '+wr.points+' weigh-ins.</div></div></div>';
}
/* How many days between two dates fall inside a maintenance window. Those
   days cost calendar time but produce no loss, so the forecast has to carry
   them or every date it prints is optimistic. */
function pauseDaysBetween(a, b){
  var n = 0, k = a, guard = 0;
  while(k < b && guard++ < 900){
    var w = planWindowFor(k);
    if(w && (+w.deficit || 0) <= 50) n++;
    k = shift(k, 1);
  }
  return n;
}
/* Roll the plan forward phase by phase from where you actually are. Each
   band's rate is the one its own deficit implies, so the forecast IS the
   plan rather than a straight line drawn through it. */
function planForecast(){
  var goal = +S.profile.goalWeight || 84;
  var w = trendWeightAt(today), d = today, out = [], guard = 0;
  while(w > goal + 0.05 && guard++ < 12){
    var band = planBandFor(w);
    if(!band) break;
    var floor = Math.max(goal, +band.above || 0);
    var drop = w - floor;
    if(drop <= 0.05){ w = floor; continue; }
    var rate = (+band.deficit || 0) * 7 / 7700;
    if(rate <= 0.01) break;
    var days = Math.round(drop / rate * 7);
    var pause = pauseDaysBetween(d, shift(d, days));
    var end = shift(d, days + pause);
    out.push({label:bandLabel((S.plan.bands||[]).indexOf(band)), deficit:+band.deficit,
              rate:rate, from:w, to:floor, weeks:drop/rate, pause:pause, start:d, end:end});
    w = floor; d = end;
  }
  return out;
}
function fmtShort(dstr){
  return new Date(dstr+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function etaText(){
  var f = planForecast();
  if(!f.length) return "reached";
  return fmtShort(f[f.length-1].end);
}

/* The plan, live. Which phase you're in, what it's costing you today, when
   each one lands — recomputed from your real trend weight every time you
   open it, so it's a forecast rather than a screenshot of a table. */
function planSection(){
  var f = planForecast(), tw = trendWeightAt(today);
  var cur_b = planBandFor(tw), win = planWindowFor(today);
  var h = '<div class="sectionhead"><h2 class="t-section">The plan</h2>'+
          '<a data-press onclick="nav(\'setup\')">edit</a></div><div class="card">';

  if(win){
    h += '<div style="padding:14px 16px">'+
      '<div class="t-head" style="margin-bottom:4px">Maintenance \u00b7 '+esc(win.label||"paused")+'</div>'+
      '<div class="t-sub" style="color:var(--label2);line-height:1.5">Deficit is '+
      Math.round(+win.deficit||0)+' until '+fmtShort(win.to)+
      '. Eating at maintenance through a hard week is a deliberate part of the plan, '+
      'not a lapse \u2014 nothing here counts it as one.</div></div>';
  } else if(cur_b){
    h += '<div style="padding:14px 16px">'+
      '<div class="t-head" style="margin-bottom:4px">Phase '+
      esc(bandLabel((S.plan.bands||[]).indexOf(cur_b)))+'</div>'+
      '<div class="t-sub" style="color:var(--label2);line-height:1.5">'+
      'Deficit <b>'+Math.round(cur_b.deficit)+'</b> \u2192 about <b>'+n1(cur_b.deficit*7/7700)+
      ' kg/week</b>. Trend weight '+n1(tw)+' kg.</div></div>';
  }

  if(!f.length){
    h += '<div class="empty">At or past your goal weight.</div>';
  } else {
    h += '<div class="kv" style="color:var(--label2);font-size:13px">'+
      '<span>Phase</span><span>Deficit \u00b7 kg/wk \u00b7 lands</span></div>';
    f.forEach(function(p,i){
      h += '<div class="kv"><span>'+(i===0?'<b>':'')+esc(p.label)+(i===0?'</b>':'')+
        (p.pause?'<br><span class="t-cap" style="color:var(--label3)">+'+p.pause+
          ' maintenance day'+(p.pause===1?'':'s')+'</span>':'')+'</span>'+
        '<span>'+Math.round(p.deficit)+' \u00b7 '+n1(p.rate)+' \u00b7 '+fmtShort(p.end)+'</span></div>';
    });
    h += '<div class="kv tot"><span>At '+n1(+S.profile.goalWeight||84)+' kg</span><span>'+
      fmtShort(f[f.length-1].end)+'</span></div>';
  }
  return h + '</div>';
}

/* Adherence: what you actually ate against what the app actually asked for.
   You have weeks of data and nothing was reading it back to you. This is the
   single most useful number on the page, because a model that's 5% off
   matters far less than a fortnight of quietly eating 250 over. */
function adherenceSection(){
  var n = 0, intake = 0, tgt = 0, prot = 0, defActual = 0, defPlanned = 0, over = 0, under = 0;
  for(var i=1;i<=14;i++){
    var d = shift(today,-i), x = peek(d);
    if(!x || !x.entries || !x.entries.length) continue;
    var b = burn(d), e = b.eaten;
    n++; intake += e.k; tgt += b.target; prot += e.p;
    defActual += (b.actual - e.k); defPlanned += b.deficit;
    if(e.k > b.target + 100) over++; else if(e.k < b.target - 250) under++;
  }
  var h = '<h2 class="t-section" style="margin:26px 0 8px 4px">Adherence</h2><div class="card">';
  if(n < 4) return h + '<div class="empty">Log food on a few more days and this compares what '+
    'you ate with what the app asked for.</div></div>';

  var dv = (intake - tgt)/n;
  var pill = Math.abs(dv) < 75 ? '<span class="pill g">within '+Math.round(Math.abs(dv))+' kcal/day</span>'
           : dv > 0 ? '<span class="pill o">'+Math.round(dv)+' kcal/day over target</span>'
                    : '<span class="pill o">'+Math.round(-dv)+' kcal/day under target</span>';
  var msg;
  if(Math.abs(dv) < 75)
    msg = "You are eating what the app asks for. That means when the scale disagrees with the "+
      "model, it's the model that's wrong \u2014 which is exactly the situation Measured burn below is for.";
  else if(dv > 0)
    msg = "Averaging "+Math.round(dv)+" kcal/day over target across "+n+" days is "+
      Math.round(dv*n/7700*100)/100+" kg of loss you didn't get. Before touching the deficit, "+
      "check the things that get logged at zero: oil, sauces, drinks, bites while cooking.";
  else
    msg = "You are averaging "+Math.round(-dv)+" kcal/day UNDER target, which on top of a "+
      Math.round(defPlanned/n)+" deficit is a bigger cut than you chose. At 18, with football, "+
      "that's the situation that costs lean mass and recovery rather than fat.";

  return h +
    '<div class="kv"><span>Average intake</span><span>'+Math.round(intake/n)+' kcal</span></div>'+
    '<div class="kv"><span>Average target</span><span>'+Math.round(tgt/n)+' kcal</span></div>'+
    '<div class="kv"><span>Average protein</span><span>'+Math.round(prot/n)+' / '+
      S.profile.proteinTarget+' g</span></div>'+
    '<div class="kv"><span>Real deficit achieved</span><span>'+Math.round(defActual/n)+
      ' vs '+Math.round(defPlanned/n)+' planned</span></div>'+
    '<div class="kv"><span>Days over / well under</span><span>'+over+' / '+under+'</span></div>'+
    '<div style="padding:12px 16px;border-top:.5px solid var(--sep)">'+
      '<div style="margin-bottom:7px">'+pill+'</div>'+
      '<div class="t-sub" style="color:var(--label2);line-height:1.5">'+msg+'</div>'+
      '<div class="t-cap" style="color:var(--label3);margin-top:9px">From '+n+
        ' logged days in the last 14.</div>'+
    '</div></div>';
}
/* preserveAspectRatio="none" was stretching the chart to the pane width, which
   scales the stroke widths unevenly with it — a 3px trend line rendered as a
   fat horizontal smear on a wide phone. Keeping the ratio and letting the SVG
   scale as a unit fixes that, and leaves room for the things the chart was
   missing: where the current phase is trying to get to, and what the band
   boundaries are. */
function chartSVG(ma){
  if(ma.length<2) return "";
  var W=560,H=190,padL=44,padR=14,padT=18,padB=26;
  var P=S.profile;
  var band = planBandFor(trendWeightAt(today));
  var bandFloor = band ? +band.above : null;

  var vals = ma.map(function(p){ return p.w; }).concat(ma.map(function(p){ return p.avg; }));
  if(bandFloor) vals.push(bandFloor);
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(max-min < 1){ var c=(max+min)/2; min=c-0.6; max=c+0.6; }
  var pd=(max-min)*0.12; min-=pd; max+=pd;
  var n=ma.length;
  var X=function(i){ return padL + (W-padL-padR)*(n===1?0.5:i/(n-1)); };
  var Y=function(v){ return padT + (H-padT-padB)*(1-(v-min)/(max-min)); };

  var dots="", raw="", avg="";
  ma.forEach(function(p,i){
    raw += (i?"L":"M")+X(i).toFixed(1)+","+Y(p.w).toFixed(1);
    avg += (i?"L":"M")+X(i).toFixed(1)+","+Y(p.avg).toFixed(1);
    dots += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="2.4" fill="var(--label3)"/>';
  });

  /* horizontal gridlines at whole kilos, so the eye has something to measure
     against — a trend line floating in an unlabelled box says very little */
  var grid = "";
  for(var kg = Math.ceil(min); kg <= Math.floor(max); kg++){
    var gy = Y(kg).toFixed(1);
    grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+
      '" stroke="var(--sep)" stroke-width="1"/>'+
      '<text x="'+(padL-6)+'" y="'+(+gy+3.5)+'" font-size="10.5" fill="var(--label3)" '+
      'text-anchor="end">'+kg+'</text>';
  }

  /* where this phase is heading */
  var goalLine = "";
  if(bandFloor && bandFloor > min && bandFloor < max){
    var by = Y(bandFloor).toFixed(1);
    goalLine = '<line x1="'+padL+'" y1="'+by+'" x2="'+(W-padR)+'" y2="'+by+
      '" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>'+
      '<text x="'+(W-padR)+'" y="'+(+by-5)+'" font-size="10.5" fill="var(--good)" '+
      'text-anchor="end">phase target '+n1(bandFloor)+'</text>';
  }

  var f = function(dstr){
    return new Date(dstr+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
  };
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" '+
      'role="img" aria-label="Weight trend over '+n+' weigh-ins">'+
    grid + goalLine +
    '<path d="'+raw+'" fill="none" stroke="var(--label3)" stroke-width="1.4" stroke-linejoin="round"/>'+
    dots+
    '<path d="'+avg+'" fill="none" stroke="var(--blue)" stroke-width="2.6" stroke-linecap="round" '+
      'stroke-linejoin="round"/>'+
    '<text x="'+padL+'" y="'+(H-7)+'" font-size="10.5" fill="var(--label3)">'+f(ma[0].d)+'</text>'+
    '<text x="'+(W-padR)+'" y="'+(H-7)+'" font-size="10.5" fill="var(--label3)" '+
      'text-anchor="end">'+f(ma[ma.length-1].d)+'</text>'+
  '</svg>';
}
function ledger(){
  var h="", tot=0, cnt=0, plan=0, foodDays=0;
  for(var i=6;i>=0;i--){
    var d = shift(today,-i), x = peek(d);
    if(!x) continue;
    var b=burn(d), e=b.eaten;
    if(!e.k && !b.football && !(+x.steps)) continue;
    /* .actual, not .total. The old line charged you the TEF of a full target
       day even when you'd eaten 400 short of it, which inflated the deficit
       on precisely the days you were strictest. */
    var def = e.k ? (b.actual - e.k) : b.actual;
    if(e.k){ tot += def; plan += b.deficit; foodDays++; }
    cnt++;
    h += '<div class="kv"><span>'+new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"short"})+
      (e.k?'':' <span style="color:var(--label3)">(no food)</span>')+
      '<br><span class="t-cap" style="color:var(--label3)">'+
      (e.k?Math.round(e.k)+' eaten \u00b7 '+Math.round(b.actual)+' out \u00b7 '+
           Math.round(b.deficit)+' planned':'burn only')+'</span></span><span>'+
      (def>=0?"\u2212":"+")+Math.abs(Math.round(def))+'</span></div>';
  }
  if(!cnt) return '<div class="empty">Nothing logged in the last 7 days.</div>';
  h += '<div class="kv tot"><span>Real deficit</span><span>'+Math.round(tot)+' kcal</span></div>';
  if(foodDays){
    h += '<div class="kv"><span>Planned over those '+foodDays+' day'+(foodDays===1?'':'s')+
      '</span><span>'+Math.round(plan)+' kcal</span></div>'+
      '<div class="kv"><span>Predicted loss</span><span>'+n1(tot/7700)+' kg</span></div>';
    var gap = tot - plan;
    if(Math.abs(gap) > 400)
      h += '<div class="note">'+(gap<0
        ? 'You came in <b>'+Math.round(-gap)+' kcal short</b> of the plan over those days \u2014 '+
          'about '+n1(-gap/7700)+' kg of loss deferred, not lost.'
        : 'You ran <b>'+Math.round(gap)+' kcal deeper</b> than planned. Deliberate is fine; '+
          'accidental is worth fixing, since it comes out of recovery first.')+'</div>';
  }
  return h;
}

function viewSetup(){
  var P=S.profile;
  return '<h1 class="t-large">Setup</h1>'+

    numRow("Age","", P.age, "setP('age',this.value)", "1", "")+
    numRow("Height","", P.height, "setP('height',this.value)", "1", "cm")+
    numRow("Lean mass","fat-free weight from the scale · drives Katch-McArdle and your goal weight",
      P.leanMass, "setP('leanMass',this.value)", "0.1", "kg")+
    '<div class="row"><div class="grow"><div class="ttl t-body">Resting metabolism</div>'+
      '<div class="sub2 t-foot">'+bmrBasis(today)+' \u2192 '+Math.round(bmrAt(today))+' kcal</div></div>'+
      '<select onchange="setBmrMode(this.value)" style="background:var(--fill);border-radius:9px;padding:8px 10px">'+

      '</select></div>'+
    (P.bmrMode==="manual"
      ? numRow("BMR by hand","", P.bmrManual, "setP('bmrManual',this.value)", "10", "kcal") : "")+
    numRow("Hours awake","the rest of the day is covered by BMR", P.wakingHours,
      "setP('wakingHours',this.value)", "0.5", "h")+

      P.walkFactor, "setP('walkFactor',this.value)", "0.01", "\u00d7")+
    numRow("Extra activity counts for","steps above your habitual level, credited at this share",

    numRow("Everything else awake","at your habitual step level \u00b7 1.2 desk-bound, 1.25 school day, 1.4 on your feet",
      P.metIdle, "setP('metIdle',this.value)", "0.05", "MET")+
    /* TWO step numbers, and the difference confuses people, so label it
       plainly. The 28-day median is measured and needs no maintenance. This
       field is a one-off anchor: the step level at which the MET figure above
       was true. The slope earns its keep from the gap between them, which is

    '<div class="kv" style="display:block">'+
      '<div style="display:flex;justify-content:space-between;gap:12px">'+
        '<span>Measured habitual steps</span>'+
        '<span>'+Math.round(habitualSteps()).toLocaleString()+'</span></div>'+
      '<div class="t-cap" style="color:var(--label3);margin-top:2px">'+
        '28-day median of the days you recorded. Updates itself every day \u2014 '+

        Math.round(Math.max(0.3,Math.min(1,pnum(P.compFactor,1)))*100)+'%.'+
      '</div></div>'+
    numRow("Typical-day anchor",
      (function(){
        var h = Math.round(habitualSteps()), ref = Math.round(+P.stepsRef||0);
        var t = "the step level the MET figure above was set at. A one-off \u2014 "+
                "leave it alone once it\u2019s right";
        /* If these two disagree, neatSlope quietly shifts idle intensity away
           from the metIdle actually set — so say so out loud, with the size of

        if(Math.abs(h - ref) >= 500)
          t += ". <b>Your measured habit is "+h.toLocaleString()+"</b>, so idle is running at "+

      })(),
      P.stepsRef, "setP('stepsRef',this.value)", "250", "")+
    numRow("A busier life lifts it by",
      "per 1000 steps of measured habit above the anchor. <b>0 is recommended</b> \u2014 "+

    '"NEAT" figure sitting next to a separate step total was counting the same thing twice. '+
    'Your waking minutes are split between walking, training and everything else, and each '+
    'slice is priced once. '+
    '<b>Walking is priced per metre, not per minute.</b> The ACSM level-walking equation puts '+
    'the net cost at 0.1 ml of oxygen per kg per metre, which reduces to '+
    '<i>stride \u00d7 weight \u00f7 2000</i> kcal per step \u2014 '+n1(perStepKcal(P,latestWeight())*1000)+

    'walking-economy literature lands. Cadence dropped out of the model entirely, because '+
    'oxygen cost follows distance rather than time. '+
    '<b>Idle intensity tracks your HABITUAL steps, never today\u2019s.</b> That is the fix for '+
    'the evening-walk problem: a 4,000-step walk used to lift idle NEAT by 0.10 MET across '+
    'fifteen waking hours, inventing about 110 kcal on top of the walk itself, on the reasoning '+
    'that people who walk more also stand and fidget more. True across people; false within '+
    'your own Tuesday. It is now keyed to a 28-day median, so one walk moves it by nothing. '+
    'The Quiet / Normal / Busy tag is gone with it \u2014 that median reads your actual life '+
    'more honestly than a tag you had to remember to press.'+
  '</div></div>'+
  '<div class="card"><div class="note"><b>Why extra activity doesn\u2019t pay full price.</b> '+
    'Exercise-compensation research consistently finds that total daily expenditure rises by '+
    'considerably less than the cost of the activity added \u2014 in pooled aerobic-exercise '+
    'trials, by roughly a third of what an additive model predicts \u2014 and the effect is '+
    '<i>amplified</i> when the activity sits on top of a diet deficit, which is your exact '+
    'situation. You move less afterwards, sit down sooner, fidget less. So steps up to your '+
    'habitual level are paid in full and only the excess is discounted. Set it to 100% if you '+

    '<i>frozen onto each day once that day is in the past</i>. That is the whole point: with one '+
    'global deficit, stepping down from 800 to 600 re-priced every day you had already logged, so '+
    'a day you hit exactly would start claiming you had under-eaten by 200. History is now '+
    'permanent \u2014 each day keeps the deficit that was genuinely in force.</div></div>'+
  ghSection()+
  '<h2 class="t-section" style="margin:26px 0 8px 4px">Backup</h2><div class="card">'+
    '<div style="padding:12px;display:flex;flex-direction:column;gap:8px">'+
      '<button class="btn dim ctl" data-press onclick="exportData()">Export a backup file</button>'+
      '<button class="btn dim ctl" data-press onclick="el(\'imp\').click()">Import a backup</button>'+
      '<input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)">'+
      '<button class="btn sec ctl" data-press onclick="copyProfile()">Copy my profile for a new chat</button>'+
    '</div><div class="note" style="border-top:.5px solid var(--sep)">'+

      'Your data lives only in this browser on this device, so export now and then — clearing '+
      'Safari\'s site data takes it with everything else.</div></div>'+
  '<div class="card"><div style="padding:12px">'+
    '<button class="btn danger ctl" data-press onclick="wipe()">Erase everything</button></div></div>'+
  '<div class="card"><div class="note"><b>How the football number is built.</b> Two published methods run in '+
    'parallel — the Keytel heart-rate regression and a %heart-rate-reserve → VO₂ → MET conversion. They\'re '+
    'averaged, your BMR for that stretch is subtracted so it isn\'t counted twice, a safety margin comes off, '+
    'and steps recorded during the session are removed because they\'re already in your daily total.</div></div>'+
  '<div style="height:20px"></div>';
}

function planEditor(){
  var pl = S.plan;
  var h = '<h2 class="t-section" style="margin:26px 0 8px 4px">Plan</h2>'+
    '<div class="seg" style="margin-bottom:12px">'+
      '<button onclick="setPlanMode(\'auto\')" style="'+(pl.mode==="auto"
        ? "background:var(--raised);border-radius:8px":"")+'">Bands decide</button>'+
      '<button onclick="setPlanMode(\'manual\')" style="'+(pl.mode!=="auto"
        ? "background:var(--raised);border-radius:8px":"")+'">One fixed number</button>'+
    '</div><div class="card">';

  if(pl.mode !== "auto"){

/* =================================================================
   MERGING A REMOTE COPY
   =================================================================
   Sync needs a stronger rule than the import merge's "whichever has more
   food wins". Every record now carries `m`, the millisecond it was last
   written, so two devices can be reconciled per-record by recency instead of
   per-file by luck. Records with no `m` predate this and lose to any record
   that has one, since anything stamped was written by the current version. */
function newer(a, b){                   // is a strictly newer than b?
  var am = +(a && a.m) || 0, bm = +(b && b.m) || 0;
  return am > bm;
}
function mergeRemote(inc){
  if(!inc || typeof inc !== "object") return {changed:false};
  var changed = false, pulled = {days:0, weights:0, waist:0, foods:0}, prof = false;

  /* A device with nothing logged on it isn't merging, it's restoring — so it
     takes the remote settings outright rather than comparing versions. Without
     this a newly set-up phone pulled all your days and weigh-ins but kept the
     stock profile, quietly running your cut on someone else's numbers. */
  var localLogged = Object.keys(S.days).filter(function(k){ return dayHasContent(S.days[k]); }).length;
  var fresh = localLogged === 0;

  /* Otherwise profile and plan move as one unit, by whichever side was edited
     last. Merging them field-by-field would let two devices produce a settings
     combination that never existed on either. */
  if(inc.profile && (fresh || (+inc.pm||0) > (+S.pm||0))){
    Object.keys(DEFAULT_PROFILE).forEach(function(k){
      if(k === "ghRepo" || k === "ghPath" || k === "ghAuto") return;   // per-device
      if(inc.profile[k] !== undefined) S.profile[k] = inc.profile[k];
    });
    if(inc.plan) S.plan = inc.plan;
    S.pm = (+inc.pm) || Date.now();
    prof = true; changed = true;
  }

  Object.keys(inc.days || {}).forEach(function(k){
    var r = inc.days[k], mine = S.days[k];
    if(!dayHasContent(r)) return;
    if(!mine){ S.days[k] = r; pulled.days++; changed = true; return; }
    if(newer(r, mine)){ S.days[k] = r; pulled.days++; changed = true; return; }
    if(newer(mine, r)) return;
    /* Neither is stamped — fall back to the old heuristic. */
    if((r.entries||[]).length > (mine.entries||[]).length){
      S.days[k] = r; pulled.days++; changed = true;
    }
  });

  var byDate = function(list, key, incoming){
    var mineBy = {};
    list.forEach(function(q){ if(q && q.d) mineBy[q.d] = q; });
    var n = 0;
    (incoming || []).forEach(function(r){
      if(!r || !r.d) return;
      var mine = mineBy[r.d];
      if(!mine){ list.push(r); mineBy[r.d] = r; n++; return; }
      if(newer(r, mine)){
        for(var i=0;i<list.length;i++) if(list[i] === mine){ list[i] = r; break; }
        mineBy[r.d] = r; n++;
      }
    });
    return n;
  };
  pulled.weights = byDate(S.weights, "w", inc.weights);
  pulled.waist   = byDate(S.waist,   "cm", inc.waist);
  if(pulled.weights || pulled.waist){ changed = true; invalidateMA(); }

  var haveF = {}; S.foods.forEach(function(f){ haveF[normName(f.n)] = 1; });
  (inc.foods || []).forEach(function(f){
    var key = normName(f && f.n);
    if(f && key && !haveF[key]){
      S.foods.push({id:f.id||uid(), n:f.n, u:f.u||"", k:f.k, p:f.p, c:f.c, f:f.f});
      haveF[key] = 1; pulled.foods++; changed = true;
    }
  });

  return {changed:changed, pulled:pulled, profile:prof};
}
/* Import MERGES rather than replaces. A straight overwrite meant loading an
   older backup silently destroyed everything logged since — and you'd only
   find out days later. Nothing here deletes: use Erase first if you genuinely
   want a clean restore. */
function mergeData(inc){
  var added = {days:0, weights:0, waist:0, foods:0}, kept = 0;

  var localLogged = Object.keys(S.days).filter(function(k){ return dayHasContent(S.days[k]); }).length;
  if(inc.profile && localLogged === 0){
    // nothing here yet — this is a restore, so the backup's settings are the real ones
    Object.keys(DEFAULT_PROFILE).forEach(function(k){
      if(inc.profile[k] !== undefined) S.profile[k] = inc.profile[k];
    });
  }

  Object.keys(inc.days || {}).forEach(function(k){
    var incoming = inc.days[k], mine = S.days[k];
    if(!dayHasContent(incoming)) return;
    if(!dayHasContent(mine)){ S.days[k] = incoming; added.days++; return; }
    // both have something: keep whichever actually holds more food
    var a = (incoming.entries||[]).length, b = (mine.entries||[]).length;
    if(a > b){ S.days[k] = incoming; added.days++; } else kept++;
  });

  var haveW = {}; S.weights.forEach(function(q){ haveW[q.d]=1; });
  (inc.weights || []).forEach(function(q){
    if(q && q.d && !haveW[q.d]){ S.weights.push(q); haveW[q.d]=1; added.weights++; }
  });
  var haveC = {}; S.waist.forEach(function(q){ haveC[q.d]=1; });
  (inc.waist || []).forEach(function(q){
    if(q && q.d && !haveC[q.d]){ S.waist.push(q); haveC[q.d]=1; added.waist++; }
  });

  var haveF = {}; S.foods.forEach(function(f){ haveF[String(f.n).toLowerCase()]=1; });
  (inc.foods || []).forEach(function(f){
    var key = String(f.n||"").toLowerCase();
    if(f && key && !haveF[key]){ S.foods.push({id:uid(), n:f.n, u:f.u||"", k:f.k, p:f.p, c:f.c, f:f.f});
      haveF[key]=1; added.foods++; }
  });
  return {added:added, kept:kept};
}
function importData(input){
  var f = input.files && input.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var inc;
    try{
      inc = JSON.parse(r.result);
      if(!inc || typeof inc !== "object" || (!inc.days && !inc.weights)) throw new Error("bad");
    }catch(e){ toast("That file didn't read as a backup"); return; }

    var incDays = Object.keys(inc.days || {}).filter(function(k){ return dayHasContent(inc.days[k]); }).length;
    var myDays  = Object.keys(S.days).filter(function(k){ return dayHasContent(S.days[k]); }).length;
    if(!confirm(
      "Backup holds "+incDays+" logged days and "+((inc.weights||[]).length)+" weigh-ins.\n"+
      "This device has "+myDays+" logged days and "+S.weights.length+" weigh-ins.\n\n"+
      "They'll be merged. Nothing already here gets deleted.")) return;

    var res = mergeData(inc);
    save(); render();
    var a = res.added;
    alert("Merged.\n\n"+
      "Days added: "+a.days+"\n"+
      "Weigh-ins added: "+a.weights+"\n"+
      "Waist readings added: "+a.waist+"\n"+
      "Foods added: "+a.foods+
      (res.kept ? "\n\nKept this device's version of "+res.kept+" day(s) that had more logged." : ""));
  };
  r.readAsText(f); input.value="";
}
function wipe(){
  if(!confirm("Erase all logged days, foods and weigh-ins? This cannot be undone.")) return;
  var keepGh = {ghRepo:S.profile.ghRepo, ghPath:S.profile.ghPath, ghAuto:S.profile.ghAuto};
  S = {profile:{}, foods:[], days:{}, weights:[], waist:[],
       plan:JSON.parse(JSON.stringify(DEFAULT_PLAN)), schema:SCHEMA, pm:Date.now()};
  Object.keys(DEFAULT_PROFILE).forEach(function(k){ S.profile[k]=DEFAULT_PROFILE[k]; });
  S.profile.ghRepo = keepGh.ghRepo; S.profile.ghPath = keepGh.ghPath;
  S.profile.ghAuto = keepGh.ghAuto;
  invalidateMA(); invalidateHab();
  S.foods = SEED_FOODS.map(function(f,i){ return {id:"s"+i, n:f.n, u:f.u, k:f.k, p:f.p, c:f.c, f:f.f}; });
  save(); render(); toast("Erased");
}

/* =================================================================
   GITHUB SYNC
   =================================================================
   Everything here costs nothing: GitHub Free has included unlimited private
   repositories since 2019, fine-grained tokens are an auth mechanism rather
   than a product, and the REST API allows 5,000 authenticated requests an
   hour on every plan. This app will use a few dozen a day.

   The token is kept under its OWN storage key, never inside S, so it cannot
   ride along in an exported backup. It is sent to api.github.com and nowhere
   else. Scope it to the one private repo, Contents: read and write, and
   nothing more — with that scope a leaked token can read and rewrite that
   single repo, which is why it should not be a classic PAT.
   ================================================================= */
function b64enc(str){
  var bytes = new TextEncoder().encode(str), out = "", CH = 0x8000;
  for(var i=0;i<bytes.length;i+=CH)
    out += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(out);
}
function b64dec(b64){
  var raw = atob(String(b64).replace(/\s+/g,""));
  var bytes = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) bytes[i] = raw.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

var GH = {
  st: {busy:false, last:0, err:"", sha:null, dirty:false, tries:0},
  timer: null,

  token: function(){ try{ return localStorage.getItem(TKEY) || ""; }catch(e){ return ""; } },
  setToken: function(t){
    try{
      t = String(t||"").trim();
      if(t) localStorage.setItem(TKEY, t); else localStorage.removeItem(TKEY);
      return true;
    }catch(e){ return false; }
  },
  repo: function(){ return String(S.profile.ghRepo||"").trim().replace(/^\/+|\/+$/g,""); },
  path: function(){ return String(S.profile.ghPath||"hiillos.json").trim().replace(/^\/+/,""); },
  ready: function(){ return !!(this.token() && /^[\w.-]+\/[\w.-]+$/.test(this.repo())); },
  url:   function(){
    return "https://api.github.com/repos/"+this.repo()+"/contents/"+
           this.path().split("/").map(encodeURIComponent).join("/");
  },

  req: function(method, url, body){
    return fetch(url, {
      method: method,
      headers: {
        "Authorization": "Bearer " + this.token(),
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "Content-Type": "application/json"
      },
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store"
    });
  },

  /* Read the remote file. A 404 is not an error — it just means this is the
     first push and the file doesn't exist yet. */
  fetchRemote: function(){
    var self = this;
    return this.req("GET", this.url()+"?ref=HEAD&t="+Date.now()).then(function(r){
      if(r.status === 404) return {missing:true, sha:null, data:null};
      if(!r.ok) return r.text().then(function(t){ throw new Error(self.explain(r.status, t)); });
      return r.json().then(function(j){
        if(!j.content && j.download_url){
          return fetch(j.download_url, {cache:"no-store"}).then(function(x){ return x.text(); })
            .then(function(txt){ return {missing:false, sha:j.sha, data:JSON.parse(txt)}; });
        }
        return {missing:false, sha:j.sha, data:JSON.parse(b64dec(j.content))};
      });
    });
  },

  explain: function(status, body){
    if(status === 401) return "Token rejected (401). It may have expired or been revoked.";
    if(status === 403 && /rate limit/i.test(body||"")) return "GitHub rate limit hit. Try later.";
    if(status === 403) return "Forbidden (403). The token needs Contents: read and write on this repo.";
    if(status === 404) return "Repo or path not found (404). Check owner/repo, and that the token can see it.";
    if(status === 409) return "Conflict (409) — the file changed underneath. Retrying.";
    if(status === 422) return "GitHub rejected the write (422). Usually a bad branch or path.";
    return "GitHub error " + status;
  },

  /* Pull, merge into local, and report whether anything changed. */
  pull: function(){
    var self = this;
    if(!this.ready()) return Promise.reject(new Error("Sync isn't set up yet."));
    return this.fetchRemote().then(function(res){
      self.st.sha = res.sha;
      if(res.missing || !res.data) return {added:null, missing:true};
      var r = mergeRemote(res.data);
      if(r.changed){ invalidateCal(); invalidateHab(); invalidateMA(); Store.save(S); }
      return r;
    });
  },

  /* Push. Always reads the remote first and merges it in, so a change made on
     another device is never simply overwritten — which is the failure mode a
     naive last-write-wins sync has, and the one that quietly eats a day of
     food logging. */
  push: function(){
    var self = this;
    if(!this.ready()) return Promise.reject(new Error("Sync isn't set up yet."));
    if(this.st.busy) return Promise.resolve({skipped:true});
    this.st.busy = true;
    return this.fetchRemote().then(function(res){
      if(res.data) mergeRemote(res.data);
      Store.save(S);
      var payload = JSON.stringify(S, null, 1);
      return self.req("PUT", self.url(), {
        message: "hiillos: " + today + " (" + Object.keys(S.days).length + " days)",
        content: b64enc(payload),
        sha: res.sha || undefined
      }).then(function(r){
        if(r.status === 409 && self.st.tries < 1){
          self.st.tries++; self.st.busy = false;
          return self.push();
        }
        if(!r.ok) return r.text().then(function(t){ throw new Error(self.explain(r.status, t)); });
        return r.json().then(function(j){
          self.st.sha = j.content && j.content.sha;
          self.st.dirty = false; self.st.tries = 0; self.st.err = "";
          self.st.last = Date.now();
          try{ localStorage.setItem("hiillos_gh_last", String(self.st.last)); }catch(e){}
          return {ok:true};
        });
      });
    }).catch(function(e){
      self.st.err = e && e.message || String(e);
      throw e;
    }).then(function(v){ self.st.busy = false; return v; },
            function(e){ self.st.busy = false; throw e; });
  },

  /* Debounced. Typing a step count fires save() on every keystroke; this
     collapses a burst of those into one commit rather than one per digit. */
  queue: function(){
    if(!this.ready() || !S.profile.ghAuto) return;
    this.st.dirty = true;
    clearTimeout(this.timer);
    var self = this;
    this.timer = setTimeout(function(){
      self.push().then(function(){ if(view==="setup") render(); })
                 .catch(function(){ if(view==="setup") render(); });
    }, 8000);
  },
  flush: function(){
    if(!this.st.dirty || !this.ready() || !S.profile.ghAuto) return;
    clearTimeout(this.timer);
    this.push().catch(function(){});
  },
  ago: function(){
    var t = this.st.last;
    if(!t){ try{ t = +localStorage.getItem("hiillos_gh_last") || 0; }catch(e){ t = 0; } }
    if(!t) return "never";
    var m = Math.round((Date.now() - t)/60000);
    if(m < 1) return "just now";
    if(m < 60) return m+" min ago";
    var h = Math.round(m/60);
    return h < 24 ? h+" h ago" : Math.round(h/24)+" d ago";
  }
};

/* =================================================================
   DAY SWIPE
   1:1 tracking, rubber-band at today (there is no tomorrow to see),
   momentum projection on release, and the commit decision made on
   velocity SIGN rather than distance — a fast flick should commit
   even if it barely moved.
   ================================================================= */
var stageSpring = null, swipe = null;

function stageX(v){
  var s = el("stage");
  if(s) s.style.transform = "translate3d("+v.toFixed(2)+"px,0,0)";
}
function ensureStageSpring(){
  if(!stageSpring) stageSpring = new Spring(0, {damping:1.0, response:0.4, onUpdate:stageX});
  return stageSpring;
}

/* The neighbouring days are built ahead of the gesture and cached. Building
   them on the first pointermove cost 2–24ms of DOM work in the middle of a
   drag, which is exactly the wrong moment to spend a frame. */
var Ghosts = {
  day:null, prev:null, next:null,
  build:function(){
    if(view !== "today") return;
    if(this.day === cur && this.prev) return;      // already correct
    this.clear();
    this.prev = this.make(shift(cur,-1), -1);
    this.next = cur === today ? null : this.make(shift(cur,1), 1);
    this.day = cur;
  },
  make:function(d, side){
    var g = document.createElement("div");
    g.className = "pane ghost";
    g.style.transform = "translateX("+(side>0?100:-100)+"%)";
    g.innerHTML = viewToday(d);
    el("stage").appendChild(g);
    fillPane(g, d);              // must look finished the instant it's visible
    g._day = d;
    return g;
  },
  clear:function(){
    var gs = document.querySelectorAll(".pane.ghost");
    for(var i=0;i<gs.length;i++) gs[i].remove();
    this.day = this.prev = this.next = null;
  },
  invalidate:function(){ this.day = null; },
  schedule:function(){
    var self = this;
    if(self._q) return;
    self._q = true;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ self._q = false; self.build(); });
    });
  }
};
function clearGhosts(){ Ghosts.clear(); }

document.addEventListener("pointerdown", function(e){
  if(view !== "today") return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  // A row that swipes to delete owns horizontal movement inside itself (§10):
  // detect both from the first move, then cancel the loser once intent is clear.
  if(e.target.closest && e.target.closest("[data-swipe-row]")) return;
  if(e.target.closest && e.target.closest("input,textarea,select,button")) return;

  var sp = ensureStageSpring();
  sp.onRest = null;          // never let a previous commit's callback survive a new grab
  Ghosts.build();            // cached, so this is usually free
  swipe = {
    id:e.pointerId, x0:e.clientX, y0:e.clientY,
    axis:null, base:sp.value,
    tracker:new Tracker(), w:window.innerWidth
  };
}, {passive:true});

document.addEventListener("pointermove", function(e){
  if(!swipe || e.pointerId !== swipe.id) return;
  var dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;

  if(!swipe.axis){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;   // hysteresis
    swipe.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if(swipe.axis === "y"){ swipe = null; return; }       // let the page scroll
    Ghosts.build();                                       // already cached
    document.body.style.userSelect = "none";
  }

  var raw = swipe.base + dx;
  // Rubber-band at today: dragging right reveals yesterday, dragging
  // left would reveal a day that hasn't happened.
  if(cur === today && raw < 0) raw = rubberband(raw, swipe.w);
  swipe.tracker.push(raw);
  ensureStageSpring().set(raw);
}, {passive:true});

function endSwipe(e){
  if(!swipe || (e && e.pointerId !== swipe.id)) return;
  var s = swipe; swipe = null;
  document.body.style.userSelect = "";
  if(s.axis !== "x"){ return; }

  var sp = ensureStageSpring();
  var v = s.tracker.velocity();
  // 0.99 rather than the scroll-tuned 0.998: this is a discrete page snap,
  // not free deceleration. At 0.998 a deliberate 40px drag projects ~180px
  // further and commits a day change the user never asked for.
  var projected = sp.value + project(v, 0.99);
  var w = s.w;

  // Commit on the projected landing point, but let a decisive flick win
  // outright — velocity sign carries the intent even over a short distance.
  var dir = 0;
  if(projected > w*0.35 || v > 550) dir = -1;             // swipe right → previous day
  else if((projected < -w*0.35 || v < -550) && cur !== today) dir = 1;

  var ghost = dir === -1 ? Ghosts.prev : dir === 1 ? Ghosts.next : null;
  if(dir && !ghost) dir = 0;                              // nothing to move to

  sp.onRest = null;
  sp.damping = dir ? 0.88 : 1.0;   // bounce only when momentum carried it (§4)
  sp.response = dir ? 0.32 : 0.38;

  if(dir){
    // Commit the day FIRST, then animate the already-correct pane home.
    // Deferring the swap to an onRest callback meant grabbing the stage
    // mid-flight could fire that callback and advance a day you didn't ask
    // for. Doing it now also makes the interruption trivially safe: you're
    // just dragging a pane that is already the right one.
    var startX = sp.value + (dir === -1 ? -w : w);
    promotePane(ghost, ghost._day);
    sp.set(startX);
    haptic(9);
  }
  sp.onRest = function(){
    sp.onRest = null;
    sp.damping = 1.0; sp.response = 0.4;
    Ghosts.schedule();             // rebuild neighbours once motion has settled
  };
  sp.to(0, v);   // hand the finger's exact velocity to the spring (§5)
}

/* Swap a neighbouring pane in as the live one. No re-render: the node
   already holds the right markup and numbers, so the day change costs
   nothing at the moment the gesture ends. */
function promotePane(g, d){
  var old = el("root");
  if(!g || !old) return;
  g.classList.remove("ghost");
  g.style.transform = "";
  old.removeAttribute("id");
  if(old.parentNode) old.parentNode.removeChild(old);
  g.id = "root";
  cur = d;
  Ghosts.clear();          // g survives: it is no longer .ghost
  todaySprings = null;
  initTodaySprings();
  syncToday(true);         // values are already on screen — don't animate them in
}
document.addEventListener("pointerup", endSwipe, {passive:true});
document.addEventListener("pointercancel", endSwipe, {passive:true});

/* =================================================================
   SWIPE TO DELETE
   ================================================================= */
var rowSwipe = null;
var ACTION_W = 96;

/* One spring per row, created once and retargeted. Making a fresh spring on
   every release meant an earlier one could still be animating toward closed
   while a new swipe opened the same row — and being on the same element, it
   would quietly drag it shut again. */
function rowSpring(surf){
  if(!surf._spring){
    surf._spring = new Spring(0, {damping:1.0, response:0.34, onUpdate:function(v){
      surf._x = v;
      surf.style.transform = "translate3d("+v.toFixed(2)+"px,0,0)";
    }});
  }
  return surf._spring;
}

document.addEventListener("pointerdown", function(e){
  var row = e.target.closest && e.target.closest("[data-swipe-row]");
  if(!row) return;
  if(e.target.closest(".action")) return;
  var surf = row.querySelector(".surface");
  if(!surf) return;
  var sp = rowSpring(surf);
  sp.set(surf._x || 0);          // halt anything in flight, right where it is
  rowSwipe = {id:e.pointerId, x0:e.clientX, y0:e.clientY, axis:null,
              row:row, surf:surf, base:surf._x || 0, tracker:new Tracker()};
}, {passive:true});

document.addEventListener("pointermove", function(e){
  if(!rowSwipe || e.pointerId !== rowSwipe.id) return;
  var dx = e.clientX - rowSwipe.x0, dy = e.clientY - rowSwipe.y0;
  if(!rowSwipe.axis){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    rowSwipe.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if(rowSwipe.axis === "y"){ rowSwipe = null; return; }
  }
  var x = rowSwipe.base + dx;
  if(x > 0) x = rubberband(x, 200);              // resist pulling it the wrong way
  if(x < -ACTION_W) x = -ACTION_W + rubberband(x + ACTION_W, 200);
  rowSwipe.tracker.push(x);
  rowSpring(rowSwipe.surf).set(x);               // drives _x and the transform
}, {passive:true});

function endRowSwipe(e){
  if(!rowSwipe || (e && e.pointerId !== rowSwipe.id)) return;
  var r = rowSwipe; rowSwipe = null;
  if(r.axis !== "x") return;

  var v = r.tracker.velocity();
  var moved = Math.abs(r.surf._x || 0);
  var projected = (r.surf._x || 0) + project(v, 0.99);
  // A flick can commit on velocity alone, but only once the row has actually
  // travelled — otherwise a sloppy tap that drifts a few pixels registers as
  // a fast flick and opens Delete on its own.
  var open = projected < -ACTION_W/2 || (v < -450 && moved > 24);
  var target = open ? -ACTION_W : 0;

  var sp = rowSpring(r.surf);
  sp.damping = open ? 0.85 : 1.0;
  sp.to(target, v);
  if(open) haptic(6);
}
document.addEventListener("pointerup", endRowSwipe, {passive:true});
document.addEventListener("pointercancel", endRowSwipe, {passive:true});

/* =================================================================
   NAVIGATION
   ================================================================= */
function goDay(n){
  if(n > 0 && cur === today) return;
  var next = shift(cur, n);
  if(next > today) return;
  cur = next; render(); haptic(6);
}
function setDate(v){ if(v && v <= today){ cur=v; render(); } }

var TABS = [
  {id:"today", label:"Today", icon:'<path d="M4 5h17v16H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 9.5h17M8.5 3v4M16.5 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'},
  {id:"football", label:"Football", icon:'<circle cx="12.5" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.5 7.4l3.6 2.6-1.4 4.3h-4.4L8.9 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>'},
  {id:"foods", label:"Foods", icon:'<path d="M7 3v8a2.5 2.5 0 005 0V3M9.5 11v10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M18 3c-1.6 1.4-2.4 3.4-2.4 5.6 0 1.6.8 2.6 2.4 2.8V21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'},
  {id:"trends", label:"Trend", icon:'<path d="M4 16.5l5-5 3.5 3.5L21 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 6.5H21v5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>'},
  {id:"setup", label:"Setup", icon:'<circle cx="12.5" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.5 3.2v2.4M12.5 18.4v2.4M21.3 12h-2.4M6.1 12H3.7M18.7 5.8l-1.7 1.7M8 16.5l-1.7 1.7M18.7 18.2L17 16.5M8 7.5L6.3 5.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'}
];
function renderTabs(){
  el("tabbar").innerHTML = TABS.map(function(t){
    return '<button class="tab'+(view===t.id?" on":"")+'" data-tab="'+t.id+'" onclick="nav(\''+t.id+'\')">'+
      '<svg viewBox="0 0 25 24">'+t.icon+'</svg><span>'+t.label+'</span></button>';
  }).join("");
}
/* The tapped tab icon springs — feedback that points at the outcome (§8) */
function bounceTab(id){
  var btn = document.querySelector('[data-tab="'+id+'"] svg');
  if(!btn || reduceMotion.matches) return;
  var s = new Spring(1, {damping:0.62, response:0.34, onUpdate:function(v){
    btn.style.transform = "scale("+v.toFixed(3)+")";
  }});
  s.velocity = -3.2;   // a kick, not a re-target: it settles back to 1
  Driver.add(s); s.resting = false;
}

function nav(v){
  if(v === view){ window.scrollTo({top:0, behavior: reduceMotion.matches ? "auto" : "smooth"}); return; }
  view = v;
  render();
  bounceTab(v);
  haptic(5);
  window.scrollTo(0,0);
}

function render(){
  var r = el("root");
  clearGhosts();
  ensureStageSpring().set(0);
  todaySprings = null;

  if(view==="today")         r.innerHTML = viewToday(cur);
  else if(view==="football") r.innerHTML = viewFootball();
  else if(view==="foods")  { r.innerHTML = viewFoods(); renderFoodList(); renderRecents(); }
  else if(view==="trends")   r.innerHTML = viewTrends();
  else                       r.innerHTML = viewSetup();

  renderTabs();
  renderTopbar();
  if(view==="today"){ initTodaySprings(); syncToday(); Ghosts.schedule(); }
  if(view==="football") positionSeg(false);
}

window.addEventListener("resize", function(){ if(view==="football") positionSeg(false); });
reduceMotion.addEventListener && reduceMotion.addEventListener("change", function(){ render(); });

/* =================================================================
   MIDNIGHT
   =================================================================
   `today` was computed once, at load. A home-screen PWA is never reloaded —
   it is suspended and resumed — so after midnight the app would still call
   yesterday "Today", refuse to navigate to the real today (the date input's
   max was stale), and keep re-stamping yesterday's deficit as if it were
   live. Re-check on every resume. */
function rollDay(){
  var now = iso(new Date());
  if(now === today) return false;
  var wasToday = (cur === today);
  today = now;
  if(wasToday || cur > today) cur = today;
  invalidateHab(); invalidateCal(); invalidateMA();
  if(S.days[today]) stampDeficit(today);
  render();
  return true;
}

/* =================================================================
   DEEP LINKS
   =================================================================
   hiillos.html#add=Chicken%20bowl%20%7C%20650%20%7C%2055%20%7C%2070%20%7C%2012
   One tap from a chat message straight into the log — no copy, no paste, no
   switching apps twice. #add64= takes the same payload base64-encoded, for
   text that would otherwise need heavy escaping. #d=YYYY-MM-DD picks the day.
   Nothing is ever added silently: it always asks first. */
function handleHash(){
  var raw = location.hash || "";
  if(!raw || raw.length < 2) return;
  var body = raw.slice(1), txt = null, want = null;
  body.split("&").forEach(function(pair){
    var eq = pair.indexOf("=");
    if(eq < 0) return;
    var k = pair.slice(0,eq), v = pair.slice(eq+1);
    try{
      if(k === "add")   txt = decodeURIComponent(v.replace(/\+/g," "));
      if(k === "add64") txt = b64dec(decodeURIComponent(v));
      if(k === "d" && /^\d{4}-\d{2}-\d{2}$/.test(v)) want = v;
    }catch(e){}
  });
  history.replaceState(null, "", location.pathname + location.search);
  if(want && want <= today) cur = want;
  if(!txt) { if(want) render(); return; }

  var items = parseBlock(txt);
  if(!items.length){ toast("Couldn\u2019t read that link"); return; }
  view = "today"; render();
  confirmItems(items, cur === today ? "today" : cur, function(){
    touch(cur).entries = day(cur).entries.concat(items);
    save(); render(); haptic(12);
    toast("Added "+items.length+" item"+(items.length===1?"":"s"));
  });
}
window.addEventListener("hashchange", handleHash);

/* Resume: check the date, then pull anything logged on another device. */
var _lastPull = 0;
function onResume(){
  var rolled = rollDay();
  if(GH.ready() && S.profile.ghAuto && Date.now() - _lastPull > 45000){
    _lastPull = Date.now();
    GH.pull().then(function(r){
      if(r && r.changed){
        if(!rolled) render();
        var p = r.pulled || {};
        var bits = [];
        if(p.days) bits.push(p.days+" day"+(p.days===1?"":"s"));
        if(p.weights) bits.push(p.weights+" weigh-in"+(p.weights===1?"":"s"));
        if(p.foods) bits.push(p.foods+" food"+(p.foods===1?"":"s"));
        toast("Pulled "+(bits.length?bits.join(", "):"changes")+" from GitHub");
      }
    }).catch(function(){});
  }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") onResume();
  else GH.flush();                     // push before iOS freezes the tab
});
window.addEventListener("focus", onResume);
window.addEventListener("pagehide", function(){ GH.flush(); });

render();
handleHash();
if(GH.ready() && S.profile.ghAuto){
  _lastPull = Date.now();
  GH.pull().then(function(r){ if(r && r.changed) render(); }).catch(function(){});
}

/* =================================================================
   Home-screen app plumbing
   ================================================================= */
if("serviceWorker" in navigator && window.isSecureContext){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      /* A home-screen PWA is resumed rather than reloaded, so without this you
         can be running a build from weeks ago and have no way of knowing. */
      reg.addEventListener("updatefound", function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener("statechange", function(){
          if(sw.state === "installed" && navigator.serviceWorker.controller){
            sheet("<b>A new version of Hiillos is ready.</b><br>"+
              "Your log is untouched \u2014 it lives in this browser, not in the app file. "+
              '<a onclick="location.reload()" style="color:var(--blue);cursor:pointer;'+
              'font-weight:600">Reload to use it.</a>');
          }
        });
      });
    }).catch(function(){});
  });
}
(function(){
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  var dismissed = false;
  try{ dismissed = localStorage.getItem("cut_install_hint")==="1"; }catch(e){}
  if(standalone || dismissed || !iOS) return;

  var bar = document.createElement("div");
  bar.className = "sheet";
  bar.innerHTML = '<div style="flex:1">Add this to your Home Screen and it opens like a real app — '+
    'tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>'+
    '<button class="ctl" data-press style="background:none;border:none;color:var(--blue);'+
    'font-size:14px;font-weight:600;cursor:pointer;padding:0 2px;flex:0 0 auto">Got it</button>';
  document.body.appendChild(bar);

  // Materialise in: scale and opacity together, so it reads as a surface arriving
  var s = new Spring(0, {damping:0.82, response:0.45, onUpdate:function(v){
    bar.style.opacity = Math.max(0, Math.min(1, v));
    bar.style.transform = "translateY("+((1-v)*20).toFixed(2)+"px) scale("+(0.93+0.07*v).toFixed(3)+")";
  }});
  s.set(0); setTimeout(function(){ s.to(1); }, 550);

  bar.querySelector("button").onclick = function(){
    try{ localStorage.setItem("cut_install_hint","1"); }catch(e){}
    var out = new Spring(1, {damping:1.0, response:0.3, onUpdate:function(v){
      bar.style.opacity = v;
      bar.style.transform = "translateY("+((1-v)*20).toFixed(2)+"px) scale("+(0.93+0.07*v).toFixed(3)+")";
    }, onRest:function(){ bar.remove(); }});
    out.to(0);
  };
})();
</script>
